<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f2a3d">
  <title>Registro de Mapa de Validade²</title>

  <!-- Abre a conexão com o Google antes da primeira consulta -->
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com">

  <style>
    :root {
      --bg: #eaeff3;
      --surface: #ffffff;
      --ink: #0f1b2d;
      --muted: #5a6877;
      --line: #d3dce5;
      --brand: #0f2a3d;
      --accent: #0a7c86;
      --accent-dark: #075e66;
      --ok: #17803d;
      --ok-bg: #e4f5ea;
      --err: #b3261e;
      --err-bg: #fdeceb;
      --warn: #a15c07;
      --warn-bg: #fff3df;
      --info-bg: #e2f1f3;
      --shadow: 0 1px 2px rgba(15, 27, 45, .06);
      color-scheme: light;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b141c;
        --surface: #142230;
        --ink: #e8eef4;
        --muted: #9aa9b8;
        --line: #284054;
        --brand: #0b1a26;
        --accent: #31b3bf;
        --accent-dark: #4cc6d1;
        --ok: #5fd08a;
        --ok-bg: #12301f;
        --err: #ff8a80;
        --err-bg: #3a1714;
        --warn: #f0b45a;
        --warn-bg: #36270f;
        --info-bg: #10323a;
        --shadow: none;
        color-scheme: dark;
      }
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html { scroll-padding-top: 90px; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      padding-bottom: env(safe-area-inset-bottom, 0);
    }

    .topbar {
      background: var(--brand);
      color: #fff;
      padding: calc(14px + env(safe-area-inset-top, 0px)) 18px 14px;
    }
    .topbar h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: .2px; }
    .topbar p { margin: 2px 0 0; font-size: 13px; color: #b9cad8; }

    main { max-width: 640px; margin: 0 auto; padding: 14px 14px 28px; }

    /* Mensagem de status fixa no topo, sempre visível ao enviar */
    #status {
      display: none;
      position: sticky;
      top: 8px;
      z-index: 20;
      margin: 0 0 12px;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid transparent;
      font-size: 14px;
      font-weight: 600;
      overflow-wrap: anywhere;
      box-shadow: 0 4px 14px rgba(0, 0, 0, .12);
    }
    #status.info    { display: block; background: var(--info-bg); color: var(--accent-dark); border-color: var(--accent); }
    #status.success { display: block; background: var(--ok-bg);   color: var(--ok);          border-color: var(--ok); }
    #status.error   { display: block; background: var(--err-bg);  color: var(--err);         border-color: var(--err); }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }
    h2 { margin: 0 0 14px; font-size: 16px; font-weight: 700; }

    .field { margin-bottom: 14px; }
    label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }

    input, select {
      width: 100%;
      min-height: 48px;
      padding: 10px 12px;
      border: 1.5px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      font: inherit;
      font-size: 17px;
    }
    input:focus-visible, select:focus-visible, button:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 1px;
      border-color: var(--accent);
    }
    #codigo { font-size: 20px; letter-spacing: 1px; font-variant-numeric: tabular-nums; }

    /* Descrição do produto */
    .description-box {
      display: none;
      margin-bottom: 14px;
      padding: 12px 14px;
      border-radius: 8px;
      border-left: 5px solid var(--accent);
      background: var(--info-bg);
    }
    .description-box.warn { border-left-color: var(--warn); background: var(--warn-bg); }
    .description-box.ok   { border-left-color: var(--ok);   background: var(--ok-bg); }
    #descricaoTexto { display: block; font-size: 17px; font-weight: 700; line-height: 1.35; overflow-wrap: anywhere; }
    #descricaoTexto:empty { display: none; }
    #descricaoStatus { display: block; font-size: 13px; color: var(--muted); }
    #descricaoTexto + #descricaoStatus { margin-top: 3px; }

    button {
      min-height: 48px;
      padding: 10px 16px;
      border: 0;
      border-radius: 8px;
      font: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .08s, background .15s;
    }
    button:active:not(:disabled) { transform: scale(.98); }
    button:disabled { opacity: .55; cursor: not-allowed; }

    .btn-camera { width: 100%; background: var(--accent); color: #fff; }
    .btn-camera:hover:not(:disabled) { background: var(--accent-dark); }
    .btn-stop { width: 100%; background: var(--err-bg); color: var(--err); margin-top: 10px; display: none; }

    #reader { display: none; margin-top: 12px; border-radius: 10px; overflow: hidden; background: #000; }
    #reader video { width: 100% !important; display: block; }
    #reader.ativo { display: block; }

    .hint { margin: 10px 0 0; font-size: 13px; color: var(--muted); }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }

    .submit-button {
      width: 100%;
      min-height: 54px;
      background: var(--ok);
      color: #fff;
      font-size: 17px;
    }
    @media (prefers-color-scheme: dark) { .submit-button { color: #07210f; } }

    .hidden-frame { display: none; width: 0; height: 0; border: 0; }

    @media (max-width: 480px) {
      .grid { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>

<body>
<header class="topbar">
  <h1>Registro de Mapa de Validade<sup>v0.0.5</sup></h1>
  <p>Leia o código, informe lote, validade e quantidade.</p>
</header>

<main>
  <div id="status" role="status" aria-live="polite"></div>

  <form id="formulario" novalidate>
    <section class="card">
      <h2>Produto</h2>

      <div id="descricaoProduto" class="description-box" aria-live="polite">
        <span id="descricaoTexto"></span>
        <span id="descricaoStatus"></span>
      </div>

      <div class="field">
        <label for="codigo">Código de barras</label>
        <input id="codigo" name="codigo" type="text" inputmode="numeric"
               autocomplete="off" placeholder="Leia ou digite o código"
               maxlength="14" required>
      </div>

      <button type="button" id="btnCamera" class="btn-camera">Ler com a câmera</button>
      <button type="button" id="btnPararCamera" class="btn-stop">Parar câmera</button>
      <div id="reader"></div>
    </section>

    <section class="card">
      <h2>Lançamento</h2>

      <div class="field">
        <label for="funcionario">Funcionário</label>
        <select id="funcionario" name="funcionario" required>
          <option value="">Selecione o funcionário</option>
          <option>Alice</option>
          <option>Altino</option>
          <option>Ana Carolina</option>
          <option>Anielle</option>
          <option>Gabriela</option>
          <option>Gabriele</option>
          <option>Isabela</option>
          <option>Livia</option>
          <option>Paola</option>
          <option>Rafaela</option>
          <option>Ramon</option>
          <option>Rillary</option>
          <option>Sulaima</option>
          <option>Thomaz</option>
        </select>
      </div>

      <div class="field">
        <label for="lote">Lote</label>
        <input id="lote" name="lote" type="text" maxlength="100"
               autocomplete="off" placeholder="Digite o lote" required>
      </div>

      <div class="grid">
        <div class="field">
          <label for="validade">Validade</label>
          <input id="validade" name="validade" type="text" inputmode="numeric"
                 maxlength="10" autocomplete="off"
                 placeholder="Ex.: 05/27" required>
        </div>
        <div class="field">
          <label for="quantidade">Quantidade</label>
          <input id="quantidade" name="quantidade" type="number" min="1" step="1"
                 inputmode="numeric" placeholder="Ex.: 12" required>
        </div>
      </div>

      <p class="hint" style="margin:-4px 0 14px">Validade aceita 05/27, 05/2027, 15/05/27 ou 15/05/2027. Só mês e ano vale o último dia do mês.</p>

      <button type="submit" id="btnSalvar" class="submit-button">Salvar lançamento</button>
    </section>
  </form>

  <iframe name="respostaPost" id="respostaPost" class="hidden-frame" title="Resposta do envio"></iframe>
</main>

<script>
"use strict";

/* URL do Web App (Apps Script) — não alterada */
const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbxDx57h_RgrSCBIPtkwCDZd00dFyM3SyAmtxWS5QzfqXJaLETbHKlVffZiclqhwKYApIA/exec";

const $ = id => document.getElementById(id);

const formulario = $("formulario");
const codigoEl = $("codigo");
const validadeEl = $("validade");
const funcionarioEl = $("funcionario");
const statusEl = $("status");
const btnSalvar = $("btnSalvar");
const btnCamera = $("btnCamera");
const btnPararCamera = $("btnPararCamera");
const readerEl = $("reader");

let scanner = null;
let cameraAtiva = false;
let enviando = false;
let consultaSequencia = 0;
let temporizadorDigitacao = null;
let temporizadorPolling = null;
let consultaScriptAtual = null;
let scriptStatusAtual = null;
let envioAtual = null;

/* =========================
   CACHE DE DESCRIÇÕES
   Memória (sessão) + localStorage (12 h) só para produtos encontrados.
   ========================= */

const TTL_CACHE = 12 * 60 * 60 * 1000;
const cacheDescricoes = new Map();

function lerCache(codigo) {
  const memoria = cacheDescricoes.get(codigo);
  if (memoria) return memoria;

  try {
    const bruto = localStorage.getItem("desc:" + codigo);
    if (!bruto) return null;
    const item = JSON.parse(bruto);
    if (Date.now() - item.t > TTL_CACHE) {
      localStorage.removeItem("desc:" + codigo);
      return null;
    }
    const valor = { status: "found", descricao: item.d };
    cacheDescricoes.set(codigo, valor);
    return valor;
  } catch (e) {
    return null;
  }
}

function gravarCache(codigo, valor) {
  cacheDescricoes.set(codigo, valor);
  if (valor.status !== "found") return;
  try {
    localStorage.setItem("desc:" + codigo,
      JSON.stringify({ d: valor.descricao, t: Date.now() }));
  } catch (e) { /* armazenamento cheio ou bloqueado: segue sem cache */ }
}

/* =========================
   MENSAGENS
   ========================= */

function mostrarStatus(mensagem, tipo = "info") {
  statusEl.textContent = mensagem;
  statusEl.className = tipo;
}

function ocultarStatus() {
  statusEl.textContent = "";
  statusEl.className = "";
}

function mostrarDescricao(mensagem, estado = "info", descricao = "") {
  const caixa = $("descricaoProduto");
  caixa.style.display = "block";
  caixa.className = "description-box" +
    (estado === "error" ? " warn" : estado === "success" ? " ok" : "");
  $("descricaoTexto").textContent = descricao;
  $("descricaoStatus").textContent = mensagem;
}

function removerScriptConsulta() {
  if (consultaScriptAtual) {
    clearTimeout(Number(consultaScriptAtual.dataset.timer));
    consultaScriptAtual.remove();
    consultaScriptAtual = null;
  }
}

function limparDescricao() {
  consultaSequencia++;

  if (temporizadorDigitacao) {
    clearTimeout(temporizadorDigitacao);
    temporizadorDigitacao = null;
  }

  removerScriptConsulta();

  const caixa = $("descricaoProduto");
  caixa.style.display = "none";
  $("descricaoTexto").textContent = "";
  $("descricaoStatus").textContent = "";
}

/* =========================
   BUSCA DA DESCRIÇÃO (JSONP)
   ========================= */

function buscarDescricaoProduto(codigoInformado) {
  const codigo = String(codigoInformado || "").trim();
  const sequencia = ++consultaSequencia;

  removerScriptConsulta();

  if (!/^\d{8,14}$/.test(codigo)) {
    $("descricaoProduto").style.display = "none";
    return;
  }

  const emCache = lerCache(codigo);

  if (emCache) {
    if (emCache.status === "found") {
      mostrarDescricao("Produto encontrado.", "success", emCache.descricao);
    } else {
      mostrarDescricao("EAN não encontrado na aba Produtos.", "error");
    }
    return;
  }

  mostrarDescricao("Buscando descrição do produto...");

  const script = document.createElement("script");
  const parametros = new URLSearchParams({
    action: "produto",
    callback: "__produtoCb",
    codigo: codigo,
    consulta: String(sequencia)
  });

  const falhar = mensagem => {
    if (consultaScriptAtual === script) consultaScriptAtual = null;
    script.remove();
    if (sequencia === consultaSequencia && codigoEl.value.trim() === codigo) {
      mostrarDescricao(mensagem, "error");
    }
  };

  script.dataset.codigo = codigo;
  script.dataset.timer = String(setTimeout(
    () => falhar("A consulta demorou demais. Você ainda pode salvar o lançamento."),
    12000
  ));
  script.onerror = () => {
    clearTimeout(Number(script.dataset.timer));
    falhar("Falha na consulta. Você ainda pode salvar o lançamento.");
  };

  script.async = true;
  script.src = APPS_SCRIPT_URL + "?" + parametros.toString();
  consultaScriptAtual = script;
  document.head.appendChild(script);
}

window.__produtoCb = function (resposta) {
  if (!resposta || typeof resposta !== "object") return;

  const codigo = String(resposta.codigo || "").trim();
  if (!/^\d{8,14}$/.test(codigo)) return;

  if (resposta.status === "found" && resposta.descricao) {
    gravarCache(codigo, { status: "found", descricao: String(resposta.descricao) });
  } else if (resposta.status === "not_found") {
    gravarCache(codigo, { status: "not_found" });
  }

  /* Callback compartilhado: ignora respostas de um EAN que já foi trocado. */
  if (codigoEl.value.trim() === codigo) {
    if (resposta.status === "found" && resposta.descricao) {
      mostrarDescricao("Produto encontrado.", "success", String(resposta.descricao));
    } else if (resposta.status === "not_found") {
      mostrarDescricao("Produto não cadastrado. O lançamento continua permitido.", "error");
    } else {
      mostrarDescricao(resposta.message || "Não foi possível consultar a descrição.", "error");
    }
  }

  document.querySelectorAll("script[data-codigo]").forEach(s => {
    if (s.dataset.codigo === codigo) {
      clearTimeout(Number(s.dataset.timer));
      s.remove();
      if (consultaScriptAtual === s) consultaScriptAtual = null;
    }
  });
};

/* =========================
   DIGITAÇÃO MANUAL
   Consulta quase imediata quando o tamanho já é de um EAN completo.
   ========================= */

codigoEl.addEventListener("input", () => {
  codigoEl.value = codigoEl.value.replace(/\D/g, "").slice(0, 14);

  limparDescricao();

  const codigo = codigoEl.value;
  if (codigo.length < 8) return;

  const completo = codigo.length === 12 || codigo.length === 13 || codigo.length === 14;

  temporizadorDigitacao = setTimeout(() => {
    if (codigoEl.value === codigo) buscarDescricaoProduto(codigo);
  }, completo ? 80 : 350);
});

/* =========================
   CÂMERA
   A biblioteca só é baixada em segundo plano, depois que a página carrega.
   ========================= */

let bibliotecaPromessa = null;

function carregarBiblioteca() {
  if (typeof Html5Qrcode !== "undefined") return Promise.resolve();
  if (bibliotecaPromessa) return bibliotecaPromessa;

  bibliotecaPromessa = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js";
    s.async = true;
    s.onload = resolve;
    s.onerror = () => { bibliotecaPromessa = null; reject(new Error("lib")); };
    document.head.appendChild(s);
  });

  return bibliotecaPromessa;
}

window.addEventListener("load", () => {
  setTimeout(() => carregarBiblioteca().catch(() => {}), 800);
});

async function iniciarCamera() {
  if (cameraAtiva) return;

  btnCamera.disabled = true;
  mostrarStatus("Abrindo a câmera...");

  try {
    await carregarBiblioteca();

    if (!scanner) {
      const F = Html5QrcodeSupportedFormats;
      scanner = new Html5Qrcode("reader", {
        formatsToSupport: [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128, F.ITF],
        useBarCodeDetectorIfSupported: true,
        verbose: false
      });
    }

    readerEl.classList.add("ativo");

    await scanner.start(
      { facingMode: "environment" },
      { fps: 15, qrbox: { width: 280, height: 120 }, aspectRatio: 1.777 },
      processarLeitura,
      () => { /* erros normais entre quadros */ }
    );

    cameraAtiva = true;
    btnPararCamera.style.display = "block";
    btnCamera.style.display = "none";
    mostrarStatus("Câmera ativa. Aponte para o código de barras.");
  } catch (erro) {
    console.error(erro);
    readerEl.classList.remove("ativo");
    btnCamera.disabled = false;
    mostrarStatus(
      "Não foi possível abrir a câmera. Verifique a permissão do navegador e a conexão.",
      "error"
    );
  }
}

async function pararCamera(silencioso = false) {
  if (scanner && cameraAtiva) {
    try {
      await scanner.stop();
      scanner.clear();
    } catch (erro) {
      console.warn("Não foi possível encerrar a câmera normalmente.", erro);
    }
  }

  cameraAtiva = false;
  readerEl.classList.remove("ativo");
  btnCamera.disabled = false;
  btnCamera.style.display = "block";
  btnPararCamera.style.display = "none";

  if (!silencioso) mostrarStatus("Câmera parada.");
}

function processarLeitura(texto) {
  const codigo = String(texto || "").replace(/\D/g, "");

  if (!/^\d{8,14}$/.test(codigo)) return;

  /* Consulta antes de fechar a câmera: a busca já corre em paralelo. */
  codigoEl.value = codigo;
  buscarDescricaoProduto(codigo);

  if (navigator.vibrate) navigator.vibrate(60);

  pararCamera(true).then(() => {
    mostrarStatus("Código lido: " + codigo, "success");
    $("lote").focus();
  });
}

btnCamera.addEventListener("click", iniciarCamera);
btnPararCamera.addEventListener("click", () => pararCamera());

/* =========================
   VALIDADE
   Aceita MM/AAAA ou DD/MM/AAAA
   ========================= */

/*
 * Máscara automática. Anos válidos começam em 19–22 (maiores que 12),
 * então o segundo grupo mostra se é mês (DD/MM/...) ou ano (MM/AAAA).
 */
function mascaraValidade(bruto) {
  const d = bruto.replace(/\D/g, "").slice(0, 8);

  if (d.length <= 2) return d;
  if (d.length <= 4) return d.slice(0, 2) + "/" + d.slice(2);

  const meio = Number(d.slice(2, 4));

  if (meio >= 1 && meio <= 12) {
    return d.slice(0, 2) + "/" + d.slice(2, 4) + "/" + d.slice(4);
  }

  return d.slice(0, 2) + "/" + d.slice(2, 6);
}

validadeEl.addEventListener("input", () => {
  validadeEl.value = mascaraValidade(validadeEl.value);
});

function validadeParaISO(valor) {
  const texto = String(valor || "").trim();
  let dia, mes, ano;

  /* Ano com 2 dígitos vira 20AA (27 → 2027). */
  const anoCompleto = a => (a.length === 2 ? 2000 + Number(a) : Number(a));

  let partes = texto.match(/^(\d{2})\/(\d{2}|\d{4})$/);

  if (partes) {
    mes = Number(partes[1]);
    ano = anoCompleto(partes[2]);

    if (mes < 1 || mes > 12 || ano < 1900 || ano > 2200) {
      throw new Error("Informe uma validade válida, como 05/27 ou 05/2027.");
    }

    dia = new Date(ano, mes, 0).getDate();
  } else {
    partes = texto.match(/^(\d{2})\/(\d{2})\/(\d{2}|\d{4})$/);

    if (!partes) {
      throw new Error("Use MM/AA, MM/AAAA, DD/MM/AA ou DD/MM/AAAA na validade.");
    }

    dia = Number(partes[1]);
    mes = Number(partes[2]);
    ano = anoCompleto(partes[3]);

    const teste = new Date(ano, mes - 1, dia);

    if (
      ano < 1900 || ano > 2200 ||
      teste.getFullYear() !== ano ||
      teste.getMonth() !== mes - 1 ||
      teste.getDate() !== dia
    ) {
      throw new Error("A data de validade informada não existe.");
    }
  }

  return ano + "-" + String(mes).padStart(2, "0") + "-" + String(dia).padStart(2, "0");
}

/* =========================
   FUNCIONÁRIO LEMBRADO
   Evita selecionar de novo a cada lançamento.
   ========================= */

try {
  const salvo = localStorage.getItem("funcionario");
  if (salvo && Array.from(funcionarioEl.options).some(o => o.value === salvo)) {
    funcionarioEl.value = salvo;
  }
} catch (e) {}

funcionarioEl.addEventListener("change", () => {
  try { localStorage.setItem("funcionario", funcionarioEl.value); } catch (e) {}
});

/* =========================
   IDENTIFICADORES SEGUROS
   ========================= */

function aleatorioHex(bytes) {
  const b = new Uint8Array(bytes);
  crypto.getRandomValues(b);
  return Array.from(b, x => x.toString(16).padStart(2, "0")).join("");
}

/* =========================
   ENVIO DO FORMULÁRIO
   ========================= */

formulario.addEventListener("submit", evento => {
  evento.preventDefault();

  if (enviando) return;

  ocultarStatus();

  const codigo = codigoEl.value.trim();
  const funcionario = funcionarioEl.value.trim();
  const lote = $("lote").value.trim();
  const validadeTexto = validadeEl.value.trim();
  const quantidadeTexto = $("quantidade").value.trim();

  if (!/^\d{8,14}$/.test(codigo)) {
    mostrarStatus("Informe um código de barras válido, com 8 a 14 dígitos.", "error");
    codigoEl.focus();
    return;
  }

  if (!funcionario) {
    mostrarStatus("Selecione o funcionário.", "error");
    funcionarioEl.focus();
    return;
  }

  if (!lote || lote.length > 100) {
    mostrarStatus("Informe o lote, com no máximo 100 caracteres.", "error");
    $("lote").focus();
    return;
  }

  let validadeISO;

  try {
    validadeISO = validadeParaISO(validadeTexto);
  } catch (erro) {
    mostrarStatus(erro.message, "error");
    validadeEl.focus();
    return;
  }

  if (!/^\d+$/.test(quantidadeTexto) ||
      !Number.isSafeInteger(Number(quantidadeTexto)) ||
      Number(quantidadeTexto) < 1) {
    mostrarStatus("Informe uma quantidade inteira maior que zero.", "error");
    $("quantidade").focus();
    return;
  }

  const payload = {
    requestId: aleatorioHex(16),
    funcionario: funcionario,
    codigo: codigo,
    lote: lote,
    validade: validadeISO,
    quantidade: Number(quantidadeTexto)
  };

  const token = aleatorioHex(32);

  enviando = true;
  btnSalvar.disabled = true;
  btnSalvar.textContent = "Enviando...";
  mostrarStatus("Enviando lançamento para a planilha...");

  envioAtual = { requestId: payload.requestId, token: token, iniciadoEm: Date.now() };

  try {
    enviarPost(payload, token);
    iniciarPolling(payload.requestId, token);
  } catch (erro) {
    finalizarErro("Não foi possível iniciar o envio: " + erro.message);
  }
});

function enviarPost(payload, token) {
  const f = document.createElement("form");

  f.method = "POST";
  f.action = APPS_SCRIPT_URL;
  f.target = "respostaPost";
  f.style.display = "none";

  const campoPayload = document.createElement("input");
  campoPayload.type = "hidden";
  campoPayload.name = "payload";
  campoPayload.value = JSON.stringify(payload);

  const campoToken = document.createElement("input");
  campoToken.type = "hidden";
  campoToken.name = "token";
  campoToken.value = token;

  f.append(campoPayload, campoToken);
  document.body.appendChild(f);
  f.submit();
  f.remove();
}

/* =========================
   POLLING DO STATUS
   Começa rápido (300 ms) e aumenta aos poucos até 1,2 s.
   ========================= */

window.__statusCb = function (resposta) {
  if (!resposta || !envioAtual) return;
  if (resposta.requestId !== envioAtual.requestId) return;

  if (resposta.status === "saved") {
    finalizarSucesso(resposta.message || "Lançamento salvo com sucesso.");
  } else if (resposta.status === "error") {
    finalizarErro(resposta.message || "Não foi possível salvar o lançamento.");
  } else {
    mostrarStatus(resposta.message || "Processando lançamento...");
  }
};

function iniciarPolling(requestId, token) {
  const inicio = Date.now();
  let tentativa = 0;

  if (temporizadorPolling) clearTimeout(temporizadorPolling);

  const proximo = () => {
    if (!envioAtual || envioAtual.requestId !== requestId) return;
    const espera = Math.min(300 + tentativa * 150, 1200);
    tentativa++;
    temporizadorPolling = setTimeout(consultar, espera);
  };

  function consultar() {
    if (!envioAtual || envioAtual.requestId !== requestId) return;

    if (Date.now() - inicio > 90000) {
      finalizarErro(
        "O sistema não confirmou o lançamento em 90 segundos. " +
        "Verifique a planilha antes de tentar enviar novamente."
      );
      return;
    }

    if (scriptStatusAtual) {
      scriptStatusAtual.remove();
      scriptStatusAtual = null;
    }

    const script = document.createElement("script");
    const parametros = new URLSearchParams({
      action: "status",
      callback: "__statusCb",
      requestId: requestId,
      token: token
    });

    const terminar = () => {
      script.remove();
      if (scriptStatusAtual === script) scriptStatusAtual = null;
      proximo();
    };

    script.async = true;
    script.onerror = terminar;
    script.onload = terminar;
    script.src = APPS_SCRIPT_URL + "?" + parametros.toString();

    scriptStatusAtual = script;
    document.head.appendChild(script);
  }

  /* Primeira checagem logo após o envio, sem esperar. */
  temporizadorPolling = setTimeout(consultar, 250);
}

function finalizarSucesso(mensagem) {
  encerrarPolling();
  enviando = false;
  envioAtual = null;
  btnSalvar.disabled = false;
  btnSalvar.textContent = "Salvar lançamento";

  mostrarStatus(mensagem, "success");
  limparCamposLancamento();
}

function finalizarErro(mensagem) {
  encerrarPolling();
  enviando = false;
  envioAtual = null;
  btnSalvar.disabled = false;
  btnSalvar.textContent = "Salvar lançamento";

  mostrarStatus(mensagem, "error");
}

function encerrarPolling() {
  if (temporizadorPolling) {
    clearTimeout(temporizadorPolling);
    temporizadorPolling = null;
  }

  if (scriptStatusAtual) {
    scriptStatusAtual.remove();
    scriptStatusAtual = null;
  }
}

/* =========================
   LIMPEZA DO FORMULÁRIO
   ========================= */

function limparCamposLancamento() {
  codigoEl.value = "";
  $("lote").value = "";
  validadeEl.value = "";
  $("quantidade").value = "";

  limparDescricao();
  codigoEl.focus();
}

window.addEventListener("beforeunload", () => {
  if (temporizadorDigitacao) clearTimeout(temporizadorDigitacao);
  if (temporizadorPolling) clearTimeout(temporizadorPolling);
});
</script>
