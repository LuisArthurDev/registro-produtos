
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f2a3d">
  <title>Visualização dos Lançamentos</title>

  <style>
    :root {
      --bg: #eaeff3;
      --surface: #fff;
      --ink: #0f1b2d;
      --muted: #5a6877;
      --line: #d3dce5;
      --brand: #0f2a3d;
      --accent: #0a7c86;
      --ok: #17803d;
      --ok-bg: #e4f5ea;
      --err: #b3261e;
      --err-bg: #fdeceb;
      --warn: #a15c07;
      --warn-bg: #fff3df;
      --shadow: 0 1px 2px rgba(15,27,45,.06);
    }

    :root[data-theme="dark"] {
      --bg: #0b141c;
      --surface: #142230;
      --ink: #e8eef4;
      --muted: #9aa9b8;
      --line: #284054;
      --brand: #0b1a26;
      --accent: #31b3bf;
      --ok: #5fd08a;
      --ok-bg: #12301f;
      --err: #ff8a80;
      --err-bg: #3a1714;
      --warn: #f0b45a;
      --warn-bg: #36270f;
      --shadow: none;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    header {
      background: var(--brand);
      color: white;
      padding: 18px;
    }

    header h1 { margin: 0; font-size: 20px; }
    header p { margin: 4px 0 0; color: #c5d4df; font-size: 13px; }

    main {
      width: min(100% - 24px, 1200px);
      margin: 18px auto 40px;
    }

    .card {
      padding: 16px;
      margin-bottom: 14px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: var(--shadow);
    }

    .modos {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }

    .modo {
      background: var(--bg);
      color: var(--ink);
      border: 1.5px solid var(--line);
    }

    .modo[aria-pressed="true"] {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .filtros {
      display: grid;
      grid-template-columns: minmax(150px, 1fr) minmax(180px, 1fr) auto;
      gap: 12px;
      align-items: end;
    }

    label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    input, select, button {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 11px;
      font: inherit;
    }

    input, select {
      color: var(--ink);
      background: var(--surface);
    }

    button {
      cursor: pointer;
      border: 0;
      background: var(--accent);
      color: white;
      font-weight: 700;
    }

    button:disabled { opacity: .6; cursor: wait; }

    .resumo {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .numero {
      font-size: 23px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .legenda { color: var(--muted); font-size: 12px; }

    #mensagem {
      padding: 12px;
      margin-bottom: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      overflow-wrap: anywhere;
    }

    .grupo { margin-bottom: 18px; }
    .grupo h2 { font-size: 17px; margin: 0 0 10px; }

    .tabela-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    table {
      width: 100%;
      min-width: 850px;
      border-collapse: collapse;
      background: var(--surface);
    }

    table.transferencias { min-width: 1100px; }
    table.validade-transferencias { min-width: 1200px; }

    th, td {
      text-align: left;
      vertical-align: middle;
      padding: 10px;
      border-bottom: 1px solid var(--line);
    }

    th {
      color: var(--muted);
      background: var(--bg);
      font-size: 12px;
    }

    td { overflow-wrap: anywhere; }
    tbody tr:last-child td { border-bottom: 0; }

    .descricao { font-weight: 700; }
    .ean { display: block; color: var(--muted); font-size: 12px; }
    .quantidade { font-weight: 800; white-space: nowrap; }

    .selo {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .selo.vencido { background: var(--err-bg); color: var(--err); }
    .selo.avencer { background: var(--warn-bg); color: var(--warn); }
    .selo.vendavel { background: var(--ok-bg); color: var(--ok); }

    .acoes-topo {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }

    .acoes-topo a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 8px 14px;
      border-radius: 8px;
      background: var(--line);
      color: var(--ink);
      text-decoration: none;
      font-weight: 700;
    }

    .acoes-linha {
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .btn-acao {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      min-width: 38px;
      min-height: 38px;
      padding: 4px;
      border-radius: 8px;
      font-size: 17px;
    }

    .btn-editar { background: #1769aa; }
    .btn-excluir { background: #b3261e; }
    .btn-sinalizar { background: #a15c07; }

    .btn-acao:disabled { opacity: .45; }

    .vazio { padding: 20px; text-align: center; color: var(--muted); }

    /* Modal de edição */
    .modal-fundo {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(0,0,0,.55);
    }

    .modal {
      width: min(100%, 430px);
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
      background: var(--surface);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 12px 40px rgba(0,0,0,.25);
    }

    .modal h2 { margin: 0 0 5px; font-size: 20px; }
    .modal p { color: var(--muted); font-size: 13px; }

    .campo-modal { margin-top: 14px; }

    .botoes-modal {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 20px;
    }

    .btn-cancelar {
      background: var(--line);
      color: var(--ink);
    }

    .btn-salvar { background: var(--accent); }

    .aviso-modal {
      margin-top: 12px;
      color: var(--warn);
      font-size: 12px;
    }

    @media (max-width: 620px) {
      .filtros { grid-template-columns: 1fr; }
      .resumo { grid-template-columns: 1fr 1fr; }
      .modos { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
<header>
  <h1>Visualização dos Lançamentos</h1>
  <p id="subtitulo">Histórico mensal de produtos por funcionário</p>
</header>

<main>
  <div class="acoes-topo">
    <a href="index.html">← Voltar ao lançamento</a>
  </div>

  <section class="card">
    <div class="modos">
      <button id="btnModoMes" class="modo" type="button" aria-pressed="true">
        Por mês de lançamento
      </button>
      <button id="btnModoValidade" class="modo" type="button" aria-pressed="false">

    <div class="filtros">

      <div id="campoStatus" hidden>
        <label for="statusValidade">Situação da validade</label>
        <select id="statusValidade">
          <option value="criticos">Vencidos e à vencer</option>
          <option value="vencido">Somente vencidos</option>
          <option value="avencer">Somente à vencer</option>
          <option value="vendavel">Somente vendáveis</option>
          <option value="todos">Todos</option>
        </select>
      </div>

      <div>
        <label for="funcionario">Funcionário</label>
        <select id="funcionario">
          <option value="">Todos os funcionários</option>
          <option>Alice</option>
          <option>Altino</option>
          <option>Ana Carolina</option>
          <option>Anielle</option>
          <option>Gabriela</option>
          <option>Gabriele</option>
          <option>Isabela</option>
          <option>Livia</option>
          <option>Paola</option>
          <option>Rafaela</option>
          <option>Ramon</option>
          <option>Rillary</option>
          <option>Sulaima</option>
          <option>Thomaz</option>
          <option>Termolabil</option>
          <option>Psicotropicos</option>
          <option>Antibioticos</option>
          <option>Transferencias</option>
        </select>
      </div>

      <button id="btnBuscar" type="button">Consultar</button>
    </div>
  </section>

  <div id="mensagem" role="status" aria-live="polite">
    Carregando lançamentos...
  </div>

  <section class="card">
    <div class="resumo">
      <div>
        <div id="totalRegistros" class="numero">0</div>
        <div class="legenda">Registros</div>
      </div>
      <div>
        <div id="totalUnidades" class="numero">0</div>
        <div class="legenda">Unidades</div>
      </div>
      <div>
        <div id="totalFuncionarios" class="numero">0</div>
        <div class="legenda">Funcionários</div>
      </div>
    </div>
  </section>

  <div id="resultado"></div>
</main>

<!-- Modal para editar -->
<div id="modalFundo" class="modal-fundo" hidden>
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="tituloModal">
    <h2 id="tituloModal">Editar lançamento</h2>
    <p id="modalProduto">Altere os campos desejados.</p>

    <form id="formEditar">
      <div class="campo-modal">
        <label for="editarLote">Lote</label>
        <input id="editarLote" type="text" maxlength="100" required>
      </div>

      <div class="campo-modal">
        <label for="editarValidade">Validade</label>
        <input id="editarValidade" type="date" required>
      </div>

      <div class="campo-modal">
        <label for="editarQuantidade">Quantidade</label>
        <input id="editarQuantidade" type="number" min="1" step="1" required>
      </div>

      <div id="avisoModal" class="aviso-modal" hidden></div>

      <div class="botoes-modal">
        <button id="btnCancelarEdicao" class="btn-cancelar" type="button">
          Cancelar
        </button>
        <button id="btnSalvarEdicao" class="btn-salvar" type="submit">
          Salvar alterações
        </button>
      </div>
    </form>
  </section>
</div>

<script>
"use strict";

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbxDx57h_RgrSCBIPtkwCDZd00dFyM3SyAmtxWS5QzfqXJaLETbHKlVffZiclqhwKYApIA/exec";

const LIMITE_VENCIDO_PADRAO = 60;
const LIMITE_VENCIDO_NUTRICAO_CONVENIENCIA = 15;
const LIMITE_A_VENCER = 160;

const $ = id => document.getElementById(id);

let todosRegistros = [];
let registrosValidade = [];
let mesCarregado = false;
let validadeCarregada = false;
let descricoesEAN = {};
let consultaEmAndamento = false;
let modo = "mes";
let registroEmEdicao = null;
let operacaoEmAndamento = false;

function mesAtualISO() {
  const agora = new Date();
  return agora.getFullYear() + "-" +
    String(agora.getMonth() + 1).padStart(2, "0");
}

function normalizar(valor) {
  return String(valor || "").trim().toLocaleLowerCase("pt-BR");
}

function ehTransferencia(registro) {
  return normalizar(registro && registro.funcionario) === "transferencias";
}

function definirMensagem(texto) {
  $("mensagem").textContent = texto;
}

function escaparTexto(valor) {
  return String(valor == null ? "" : valor);
}

/* =========================
   PRODUTOS E EAN
   ========================= */

function carregarDescricoes() {
  return fetch("produtos_ean.json?v=2", { cache: "no-cache" })
    .then(resposta => {
      if (!resposta.ok) {
        throw new Error("Não foi possível carregar produtos_ean.json.");
      }
      return resposta.json();
    })
    .then(dados => {
      if (!dados || typeof dados !== "object" || Array.isArray(dados)) {
        throw new Error("A base de produtos não é um JSON válido.");
      }
      descricoesEAN = dados;
    });
}

function candidatosEAN(ean) {
  const codigo = String(ean || "").trim();
  const candidatos = [codigo];

  if (/^\d{12}$/.test(codigo)) candidatos.push("0" + codigo);
  if (/^0\d{12}$/.test(codigo)) candidatos.push(codigo.slice(1));

  return candidatos;
}

function obterProdutoEAN(ean) {
  for (const candidato of candidatosEAN(ean)) {
    if (!Object.prototype.hasOwnProperty.call(descricoesEAN, candidato)) continue;

    const item = descricoesEAN[candidato];

    if (typeof item === "string") {
      return { produto: item, secao: "" };
    }

    if (item && typeof item === "object") {
      return {
        produto: String(item.produto || "Descrição não encontrada"),
        secao: String(item.secao || "").trim()
      };
    }
  }

  return { produto: "Descrição não encontrada", secao: "" };
}

function obterDescricao(ean) {
  return obterProdutoEAN(ean).produto;
}

function obterSecao(ean) {
  return obterProdutoEAN(ean).secao;
}

/* =========================
   CHAMADAS JSONP AO APPS SCRIPT
   ========================= */

function chamarApps(action, callbackName, extra) {
  return new Promise((resolve, reject) => {
    const script = document.createElement("script");
    const anterior = window[callbackName];
    let finalizado = false;

    function finalizar() {
      if (finalizado) return false;

      finalizado = true;
      clearTimeout(limite);
      script.remove();

      if (anterior) window[callbackName] = anterior;
      else delete window[callbackName];

      return true;
    }

    const limite = setTimeout(() => {
      if (finalizar()) reject(new Error("timeout"));
    }, 20000);

    window[callbackName] = resposta => {
      if (finalizar()) resolve(resposta);
    };

    script.onerror = () => {
      if (finalizar()) reject(new Error("falha"));
    };

    const parametros = new URLSearchParams(
      Object.assign({ action, callback: callbackName }, extra || {})
    );

    script.src = APPS_SCRIPT_URL + "?" + parametros.toString();
    document.head.appendChild(script);
  });
}

function mensagemDeErroConsulta(erro) {
  if (erro && erro.message === "timeout") {
    return "A consulta demorou demais. Verifique a conexão e tente novamente.";
  }

  return "Falha ao acessar o Apps Script. Confira a implantação e tente novamente.";
}

function iniciarConsulta(texto) {
  if (consultaEmAndamento || operacaoEmAndamento) return false;

  consultaEmAndamento = true;
  $("btnBuscar").disabled = true;
  definirMensagem(texto);

  return true;
}

function encerrarConsulta() {
  consultaEmAndamento = false;
  $("btnBuscar").disabled = false;
}

function consultarHistorico() {
  const mes = $("mes").value;

  if (!/^\d{4}-\d{2}$/.test(mes)) {
    definirMensagem("Selecione um mês válido.");
    return;
  }

  if (!iniciarConsulta("Consultando os lançamentos...")) return;

  chamarApps("historicoMes", "__historicoCb", { mes })
    .then(resposta => {
      encerrarConsulta();

      if (!resposta || !resposta.sucesso) {
        definirMensagem(resposta?.mensagem || "Não foi possível consultar o histórico.");
        return;
      }

      todosRegistros = Array.isArray(resposta.registros) ? resposta.registros : [];
      mesCarregado = true;

      if (modo === "mes") renderizar();
    })
    .catch(erro => {
      encerrarConsulta();
      definirMensagem(mensagemDeErroConsulta(erro));
    });
}

function consultarValidades() {
  if (!iniciarConsulta("Consultando as validades...")) return;

  chamarApps("validades", "__validadeCb", {})
    .then(resposta => {
      encerrarConsulta();

      if (!resposta || !resposta.sucesso) {
        definirMensagem(resposta?.mensagem || "Não foi possível consultar as validades.");
        return;
      }

      registrosValidade = Array.isArray(resposta.registros) ? resposta.registros : [];
      validadeCarregada = true;

      if (modo === "validade") renderizar();
    })
    .catch(erro => {
      encerrarConsulta();
      definirMensagem(mensagemDeErroConsulta(erro));
    });
}

function consultar() {
  if (modo === "validade") consultarValidades();
  else consultarHistorico();
}

/* =========================
   DATA E SITUAÇÃO
   ========================= */

function diasAte(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ""));
  if (!m) return null;

  const alvo = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  const agora = new Date();
  const hoje = new Date(agora.getFullYear(), agora.getMonth(), agora.getDate());

  return Math.round((alvo - hoje) / 86400000);
}

function validadeParaISO(texto) {
  const partes = String(texto || "").split("/");

  if (partes.length !== 3) return "";

  return partes[2] + "-" +
    String(partes[1]).padStart(2, "0") + "-" +
    String(partes[0]).padStart(2, "0");
}

function validadeParaExibicao(iso) {
  const partes = String(iso || "").split("-");

  if (partes.length !== 3) return "";

  return partes[2] + "/" + partes[1] + "/" + partes[0];
}

function limiteVencidoPorSecao(secao) {
  const s = String(secao || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .trim()
    .toUpperCase();

  return s === "NUTRICAO" || s === "CONVENIENCIA"
    ? LIMITE_VENCIDO_NUTRICAO_CONVENIENCIA
    : LIMITE_VENCIDO_PADRAO;
}

function situacao(dias, secao = "") {
  if (dias <= limiteVencidoPorSecao(secao)) {
    return { chave: "vencido", texto: "VENCIDO" };
  }

  if (dias <= LIMITE_A_VENCER) {
    return { chave: "avencer", texto: "À VENCER - " + dias + " dias" };
  }

  return { chave: "vendavel", texto: "VENDÁVEL - " + dias + " dias" };
}

/* =========================
   CONSTRUÇÃO DA TABELA
   ========================= */

function criarCelula(texto, classe) {
  const td = document.createElement("td");
  if (classe) td.className = classe;
  td.textContent = texto == null ? "" : String(texto);
  return td;
}

function criarCabecalho(colunas) {
  const thead = document.createElement("thead");
  const tr = document.createElement("tr");

  colunas.forEach(titulo => {
    const th = document.createElement("th");
    th.textContent = titulo;
    tr.appendChild(th);
  });

  thead.appendChild(tr);
  return thead;
}

function criarCelulaProduto(codigo) {
  const td = document.createElement("td");

  const descricao = document.createElement("span");
  descricao.className = "descricao";
  descricao.textContent = obterDescricao(codigo);

  const ean = document.createElement("span");
  ean.className = "ean";
  ean.textContent = "EAN: " + (codigo || "");

  td.append(descricao, ean);
  return td;
}

function atualizarResumo(registros) {
  $("totalRegistros").textContent = registros.length.toLocaleString("pt-BR");

  $("totalUnidades").textContent = registros.reduce(
    (total, registro) => total + (Number(registro.quantidade) || 0),
    0
  ).toLocaleString("pt-BR");

  $("totalFuncionarios").textContent = new Set(
    registros.map(registro => registro.funcionario)
  ).size.toLocaleString("pt-BR");
}

function mostrarVazio(texto) {
  const vazio = document.createElement("div");
  vazio.className = "card vazio";
  vazio.textContent = texto;
  $("resultado").appendChild(vazio);
}

function renderizar() {
  if (modo === "validade") renderizarValidade();
  else renderizarMes();
}

/* =========================
   BOTÕES DE AÇÃO
   ========================= */

function obterChave(registro) {
  return String(registro.chaveUnica || registro.id || "").trim();
}

function criarBotaoAcao(rotulo, classe, titulo, aoClicar) {
  const botao = document.createElement("button");

  botao.type = "button";
  botao.className = "btn-acao " + classe;
  botao.textContent = rotulo;
  botao.title = titulo;
  botao.setAttribute("aria-label", titulo);
  botao.addEventListener("click", aoClicar);

  return botao;
}

function criarCelulaAcoes(registro) {
  const td = document.createElement("td");
  const grupo = document.createElement("div");

  grupo.className = "acoes-linha";

  const chave = obterChave(registro);
  const temChave = Boolean(chave);

  const editar = criarBotaoAcao(
    "✎",
    "btn-editar",
    "Editar lote, validade e quantidade",
    () => abrirEdicao(registro)
  );

  editar.disabled = !temChave || operacaoEmAndamento;

  const excluir = criarBotaoAcao(
    "✕",
    "btn-excluir",
    "Excluir lançamento",
    () => excluirLancamento(registro)
  );

  excluir.disabled = !temChave || operacaoEmAndamento;

  const sinalizar = criarBotaoAcao(
    "⚑",
    "btn-sinalizar",
    "Mostrar identificação do registro",
    () => {
      alert(
        "Funcionário: " + (registro.funcionario || "") +
        "\nEAN: " + (registro.codigo || "") +
        "\nChave: " + (chave || "Não disponível")
      );
    }
  );

  grupo.append(editar, excluir, sinalizar);
  td.appendChild(grupo);

  return td;
}

/* =========================
   RENDERIZAR HISTÓRICO
   ========================= */

function renderizarMes() {
  const funcionarioSelecionado = $("funcionario").value;

  const registros = todosRegistros.filter(registro =>
    !funcionarioSelecionado ||
    normalizar(registro.funcionario) === normalizar(funcionarioSelecionado)
  );

  atualizarResumo(registros);

  const destino = $("resultado");
  destino.replaceChildren();

  if (!registros.length) {
    definirMensagem("Nenhum lançamento encontrado para os filtros selecionados.");
    mostrarVazio("Não há lançamentos para exibir.");
    return;
  }

  definirMensagem(registros.length + " registro(s) encontrado(s) em " + $("mes").value + ".");

  const grupos = new Map();

  registros.forEach(registro => {
    const nome = registro.funcionario || "Funcionário não informado";

    if (!grupos.has(nome)) grupos.set(nome, []);
    grupos.get(nome).push(registro);
  });

  Array.from(grupos.keys()).sort((a, b) => a.localeCompare(b, "pt-BR"))
    .forEach(nome => {
      const registrosGrupo = grupos.get(nome);
      const transferencia = normalizar(nome) === "transferencias";

      const grupo = document.createElement("section");
      grupo.className = "card grupo";

      const titulo = document.createElement("h2");
      titulo.textContent = nome + " (" + registrosGrupo.length + " registro(s))";
      grupo.appendChild(titulo);

      const wrap = document.createElement("div");
      wrap.className = "tabela-wrap";

      const tabela = document.createElement("table");
      if (transferencia) tabela.classList.add("transferencias");

      const colunas = [
        "Produto / EAN",
        "Lote",
        "Validade",
        "Quantidade"
      ];

      if (transferencia) {
        colunas.push("Loja de Origem", "Romaneio", "Mês de Lançamento");
      } else {
        colunas.push("Data do lançamento");
      }

      colunas.push("Ações");
      tabela.appendChild(criarCabecalho(colunas));

      const tbody = document.createElement("tbody");

      registrosGrupo.slice()
        .sort((a, b) => (Number(b.ts) || 0) - (Number(a.ts) || 0))
        .forEach(registro => {
          const tr = document.createElement("tr");

          tr.appendChild(criarCelulaProduto(registro.codigo));
          tr.appendChild(criarCelula(registro.lote));
          tr.appendChild(criarCelula(registro.validade));
          tr.appendChild(criarCelula(
            Number(registro.quantidade || 0).toLocaleString("pt-BR"),
            "quantidade"
          ));

          if (transferencia) {
            tr.appendChild(criarCelula(registro.lojaOrigem || ""));
            tr.appendChild(criarCelula(registro.romaneio || ""));
            tr.appendChild(criarCelula(registro.mesLancamento || registro.dataLancamento || ""));
          } else {
            tr.appendChild(criarCelula(registro.dataLancamento || ""));
          }

          tr.appendChild(criarCelulaAcoes(registro));
          tbody.appendChild(tr);
        });

      tabela.appendChild(tbody);
      wrap.appendChild(tabela);
      grupo.appendChild(wrap);
      destino.appendChild(grupo);
    });
}

/* =========================
   RENDERIZAR VALIDADES
   ========================= */

function renderizarValidade() {
  const funcionarioSelecionado = $("funcionario").value;
  const filtro = $("statusValidade").value;
  const itens = [];

  registrosValidade.forEach(registro => {
    if (
      funcionarioSelecionado &&
      normalizar(registro.funcionario) !== normalizar(funcionarioSelecionado)
    ) return;

    const dias = diasAte(registro.validadeISO);
    if (dias === null) return;

    const sit = situacao(dias, obterSecao(registro.codigo));

    if (filtro === "criticos" && sit.chave === "vendavel") return;

    if (filtro !== "criticos" && filtro !== "todos" && sit.chave !== filtro) {
      return;
    }

    itens.push({ registro, dias, sit });
  });

  itens.sort((a, b) => a.dias - b.dias);
  atualizarResumo(itens.map(item => item.registro));

  const destino = $("resultado");
  destino.replaceChildren();

  if (!itens.length) {
    definirMensagem("Nenhum produto encontrado para os filtros selecionados.");
    mostrarVazio("Não há produtos para exibir.");
    return;
  }

  definirMensagem(
    itens.length + " produto(s) listado(s), do mais próximo de vencer ao mais distante. " +
    "Nutrição e Conveniência: vencido até " +
    LIMITE_VENCIDO_NUTRICAO_CONVENIENCIA +
    " dias; demais seções: vencido até " + LIMITE_VENCIDO_PADRAO +
    " dias; à vencer até " + LIMITE_A_VENCER + " dias."
  );

  const mostrarTransferencias = itens.some(item => ehTransferencia(item.registro));

  const card = document.createElement("section");
  card.className = "card grupo";

  const wrap = document.createElement("div");
  wrap.className = "tabela-wrap";

  const tabela = document.createElement("table");
  if (mostrarTransferencias) tabela.className = "validade-transferencias";

  const colunas = [
    "Situação",
    "Produto / EAN",
    "Lote",
    "Validade",
    "Quantidade",
    "Funcionário"
  ];

  if (mostrarTransferencias) colunas.push("Loja de Origem", "Romaneio");

  colunas.push("Ações");
  tabela.appendChild(criarCabecalho(colunas));

  const tbody = document.createElement("tbody");

  itens.forEach(item => {
    const registro = item.registro;
    const tr = document.createElement("tr");

    const tdSituacao = document.createElement("td");
    const selo = document.createElement("span");

    selo.className = "selo " + item.sit.chave;
    selo.textContent = item.sit.texto;
    tdSituacao.appendChild(selo);
    tr.appendChild(tdSituacao);

    tr.appendChild(criarCelulaProduto(registro.codigo));
    tr.appendChild(criarCelula(registro.lote));
    tr.appendChild(criarCelula(registro.validade));
    tr.appendChild(criarCelula(
      Number(registro.quantidade || 0).toLocaleString("pt-BR"),
      "quantidade"
    ));
    tr.appendChild(criarCelula(registro.funcionario));

    if (mostrarTransferencias) {
      tr.appendChild(criarCelula(registro.lojaOrigem || ""));
      tr.appendChild(criarCelula(registro.romaneio || ""));
    }

    tr.appendChild(criarCelulaAcoes(registro));
    tbody.appendChild(tr);
  });

  tabela.appendChild(tbody);
  wrap.appendChild(tabela);
  card.appendChild(wrap);
  destino.appendChild(card);
}

/* =========================
   ABRIR E SALVAR EDIÇÃO
   ========================= */

function abrirEdicao(registro) {
  const chave = obterChave(registro);

  if (!chave) {
    alert("Não foi possível identificar esse lançamento. Atualize a página e tente novamente.");
    return;
  }

  registroEmEdicao = registro;

  $("modalProduto").textContent =
    obterDescricao(registro.codigo) + " — EAN: " + registro.codigo;

  $("editarLote").value = registro.lote || "";
  $("editarValidade").value =
    registro.validadeISO || validadeParaISO(registro.validade);
  $("editarQuantidade").value = Number(registro.quantidade) || 1;

  $("avisoModal").hidden = true;
  $("avisoModal").textContent = "";
  $("btnSalvarEdicao").disabled = false;
  $("btnSalvarEdicao").textContent = "Salvar alterações";
  $("modalFundo").hidden = false;

  $("editarLote").focus();
}

function fecharEdicao() {
  if (operacaoEmAndamento) return;

  $("modalFundo").hidden = true;
  registroEmEdicao = null;
}

function mostrarAvisoModal(texto) {
  $("avisoModal").textContent = texto;
  $("avisoModal").hidden = false;
}

$("btnCancelarEdicao").addEventListener("click", fecharEdicao);

$("modalFundo").addEventListener("click", evento => {
  if (evento.target === $("modalFundo")) fecharEdicao();
});

document.addEventListener("keydown", evento => {
  if (evento.key === "Escape" && !$("modalFundo").hidden) fecharEdicao();
});

$("formEditar").addEventListener("submit", async evento => {
  evento.preventDefault();

  if (!registroEmEdicao || operacaoEmAndamento) return;

  const registro = registroEmEdicao;
  const chave = obterChave(registro);
  const lote = $("editarLote").value.trim();
  const validade = $("editarValidade").value;
  const quantidade = $("editarQuantidade").value;

  if (!lote) {
    mostrarAvisoModal("Informe o lote.");
    return;
  }

  if (!validade) {
    mostrarAvisoModal("Informe a validade.");
    return;
  }

  if (!Number.isSafeInteger(Number(quantidade)) || Number(quantidade) < 1) {
    mostrarAvisoModal("A quantidade deve ser um número inteiro maior que zero.");
    return;
  }

  operacaoEmAndamento = true;
  $("btnSalvarEdicao").disabled = true;
  $("btnCancelarEdicao").disabled = true;
  $("btnSalvarEdicao").textContent = "Salvando...";
  mostrarAvisoModal("Salvando alterações...");

  try {
    const resposta = await chamarApps("editarLancamento", "__editarCb", {
      funcionario: registro.funcionario,
      chaveUnica: chave,
      lote: lote,
      validade: validade,
      quantidade: String(quantidade)
    });

    if (!resposta || !resposta.sucesso) {
      throw new Error(resposta?.mensagem || "Não foi possível editar o lançamento.");
    }

    $("modalFundo").hidden = true;
    registroEmEdicao = null;
    definirMensagem(resposta.mensagem || "Lançamento atualizado.");

    // Atualiza os dados apresentados consultando novamente a planilha.
    if (modo === "validade") {
      validadeCarregada = false;
      consultarValidades();
    } else {
      mesCarregado = false;
      consultarHistorico();
    }

  } catch (erro) {
    mostrarAvisoModal(erro.message || "Falha ao salvar as alterações.");
  } finally {
    operacaoEmAndamento = false;
    $("btnSalvarEdicao").disabled = false;
    $("btnCancelarEdicao").disabled = false;
    $("btnSalvarEdicao").textContent = "Salvar alterações";
  }
});

/* =========================
   EXCLUIR LANÇAMENTO
   ========================= */

async function excluirLancamento(registro) {
  if (operacaoEmAndamento) return;

  const chave = obterChave(registro);

  if (!chave) {
    alert("Não foi possível identificar esse lançamento. Atualize a página.");
    return;
  }

  const confirmar = confirm(
    "Deseja excluir este lançamento?\n\n" +
    "Produto: " + obterDescricao(registro.codigo) + "\n" +
    "Lote: " + (registro.lote || "") + "\n" +
    "Validade: " + (registro.validade || "") + "\n" +
    "Quantidade: " + (registro.quantidade || 0) + "\n\n" +
    "Essa ação não pode ser desfeita."
  );

  if (!confirmar) return;

  operacaoEmAndamento = true;
  definirMensagem("Excluindo lançamento...");

  try {
    const resposta = await chamarApps("excluirLancamento", "__excluirCb", {
      funcionario: registro.funcionario,
      chaveUnica: chave
    });

    if (!resposta || !resposta.sucesso) {
      throw new Error(resposta?.mensagem || "Não foi possível excluir o lançamento.");
    }

    alert(resposta.mensagem || "Operação concluída.");

    if (modo === "validade") {
      validadeCarregada = false;
      await atualizarDadosAtuais();
    } else {
      mesCarregado = false;
      await atualizarDadosAtuais();
    }

  } catch (erro) {
    definirMensagem(erro.message || "Falha ao excluir lançamento.");
    alert(erro.message || "Falha ao excluir lançamento.");
  } finally {
    operacaoEmAndamento = false;
  }
}

async function atualizarDadosAtuais() {
  // Faz a consulta novamente após a operação.
  if (modo === "validade") {
    await carregarValidadesSilenciosamente();
  } else {
    await carregarHistoricoSilenciosamente();
  }
}

async function carregarHistoricoSilenciosamente() {
  try {
    const resposta = await chamarApps("historicoMes", "__historicoCb", {
      mes: $("mes").value
    });

    if (!resposta || !resposta.sucesso) {
      throw new Error(resposta?.mensagem || "Falha ao atualizar histórico.");
    }

    todosRegistros = Array.isArray(resposta.registros) ? resposta.registros : [];
    mesCarregado = true;
    renderizar();
  } catch (erro) {
    definirMensagem(mensagemDeErroConsulta(erro));
  }
}

async function carregarValidadesSilenciosamente() {
  try {
    const resposta = await chamarApps("validades", "__validadeCb", {});

    if (!resposta || !resposta.sucesso) {
      throw new Error(resposta?.mensagem || "Falha ao atualizar validades.");
    }

    registrosValidade = Array.isArray(resposta.registros) ? resposta.registros : [];
    validadeCarregada = true;
    renderizar();
  } catch (erro) {
    definirMensagem(mensagemDeErroConsulta(erro));
  }
}

/* =========================
   TROCA DE MODO
   ========================= */

function definirModo(novoModo) {
  modo = novoModo;

  const validade = modo === "validade";

  $("btnModoMes").setAttribute("aria-pressed", String(!validade));
  $("btnModoValidade").setAttribute("aria-pressed", String(validade));

  $("campoMes").hidden = validade;
  $("campoStatus").hidden = !validade;

  $("subtitulo").textContent = validade
    ? "Produtos organizados pela situação da validade"
    : "Histórico mensal de produtos por funcionário";

  $("resultado").replaceChildren();

  if (validade) {
    if (validadeCarregada) renderizar();
    else consultarValidades();
  } else {
    if (mesCarregado) renderizar();
    else consultarHistorico();
  }
}

$("btnModoMes").addEventListener("click", () => definirModo("mes"));
$("btnModoValidade").addEventListener("click", () => definirModo("validade"));
$("btnBuscar").addEventListener("click", consultar);
$("funcionario").addEventListener("change", renderizar);
$("statusValidade").addEventListener("change", renderizar);
$("mes").addEventListener("change", () => {
  mesCarregado = false;
});

$("mes").value = mesAtualISO();

const parametrosURL = new URLSearchParams(window.location.search);
const funcionarioURL = parametrosURL.get("funcionario");

if (funcionarioURL) {
  const opcao = Array.from($("funcionario").options).find(
    item => normalizar(item.value) === normalizar(funcionarioURL)
  );

  if (opcao) $("funcionario").value = opcao.value;
}

carregarDescricoes()
  .then(consultarHistorico)
  .catch(erro => {
    console.error(erro);
    definirMensagem(
      "Não foi possível carregar produtos_ean.json. Confira se ele está na mesma pasta desta página."
    );
  });
</script>
