
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f2a3d">
  <title>Visualização dos Lançamentos</title>

  <style>
    :root {
      --bg: #eaeff3;
      --surface: #fff;
      --ink: #0f1b2d;
      --muted: #5a6877;
      --line: #d3dce5;
      --brand: #0f2a3d;
      --accent: #0a7c86;
      --ok: #17803d;
      --warn-bg: #fff3df;
      --shadow: 0 1px 2px rgba(15,27,45,.06);
    }

    :root[data-theme="dark"] {
      --bg: #0b141c;
      --surface: #142230;
      --ink: #e8eef4;
      --muted: #9aa9b8;
      --line: #284054;
      --brand: #0b1a26;
      --accent: #31b3bf;
      --ok: #5fd08a;
      --warn-bg: #36270f;
      --shadow: none;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    header {
      background: var(--brand);
      color: white;
      padding: 18px;
    }

    header h1 { margin: 0; font-size: 20px; }
    header p { margin: 4px 0 0; color: #c5d4df; font-size: 13px; }

    main {
      width: min(100% - 24px, 1000px);
      margin: 18px auto 40px;
    }

    .card {
      padding: 16px;
      margin-bottom: 14px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: var(--shadow);
    }

    .filtros {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 12px;
      align-items: end;
    }

    label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    input, select, button {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 11px;
      font: inherit;
    }

    input, select {
      color: var(--ink);
      background: var(--surface);
    }

    button {
      cursor: pointer;
      border: 0;
      background: var(--accent);
      color: white;
      font-weight: 700;
    }

    button:disabled { opacity: .6; cursor: wait; }

    .resumo {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .numero {
      font-size: 23px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .legenda { color: var(--muted); font-size: 12px; }

    #mensagem {
      padding: 12px;
      margin-bottom: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      overflow-wrap: anywhere;
    }

    .grupo { margin-bottom: 18px; }
    .grupo h2 { font-size: 17px; margin: 0 0 10px; }

    .tabela-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    table {
      width: 100%;
      min-width: 690px;
      border-collapse: collapse;
      background: var(--surface);
    }

    th, td {
      text-align: left;
      vertical-align: top;
      padding: 10px;
      border-bottom: 1px solid var(--line);
    }

    th {
      color: var(--muted);
      background: var(--bg);
      font-size: 12px;
    }

    td { overflow-wrap: anywhere; }
    tbody tr:last-child td { border-bottom: 0; }

    .descricao { font-weight: 700; }
    .ean { display: block; color: var(--muted); font-size: 12px; }
    .quantidade { font-weight: 800; white-space: nowrap; }

    .acoes {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }

    .acoes a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 8px 14px;
      border-radius: 8px;
      background: var(--line);
      color: var(--ink);
      text-decoration: none;
      font-weight: 700;
    }

    .vazio { padding: 20px; text-align: center; color: var(--muted); }

    @media (max-width: 620px) {
      .filtros { grid-template-columns: 1fr; }
      .resumo { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>

<body>
<header>
  <h1>Visualização dos Lançamentos</h1>
  <p>Histórico mensal de produtos por funcionário</p>
</header>

<main>
  <div class="acoes">
    <a href="index.html">← Voltar ao lançamento</a>
  </div>

  <section class="card">
    <div class="filtros">
      <div>
        <label for="mes">Mês do lançamento</label>
        <input id="mes" type="month">
      </div>

      <div>
        <label for="funcionario">Funcionário</label>
        <select id="funcionario">
          <option value="">Todos os funcionários</option>
          <option>Alice</option>
          <option>Altino</option>
          <option>Ana Carolina</option>
          <option>Anielle</option>
          <option>Gabriela</option>
          <option>Gabriele</option>
          <option>Isabela</option>
          <option>Livia</option>
          <option>Paola</option>
          <option>Rafaela</option>
          <option>Ramon</option>
          <option>Rillary</option>
          <option>Sulaima</option>
          <option>Thomaz</option>
          <option>Termolabil</option>
          <option>Psicotropicos</option>
          <option>Antibioticos</option>
        </select>
      </div>

      <button id="btnBuscar" type="button">Consultar</button>
    </div>
  </section>

  <div id="mensagem" role="status" aria-live="polite">
    Carregando histórico...
  </div>

  <section class="card">
    <div class="resumo">
      <div>
        <div id="totalRegistros" class="numero">0</div>
        <div class="legenda">Lançamentos</div>
      </div>
      <div>
        <div id="totalUnidades" class="numero">0</div>
        <div class="legenda">Unidades lançadas</div>
      </div>
      <div>
        <div id="totalFuncionarios" class="numero">0</div>
        <div class="legenda">Funcionários</div>
      </div>
    </div>
  </section>

  <div id="resultado"></div>
</main>

<script>
"use strict";

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbxDx57h_RgrSCBIPtkwCDZd00dFyM3SyAmtxWS5QzfqXJaLETbHKlVffZiclqhwKYApIA/exec";

const $ = id => document.getElementById(id);

let todosRegistros = [];
let descricoesEAN = {};
let consultaEmAndamento = false;

function mesAtualISO() {
  const agora = new Date();
  return agora.getFullYear() + "-" +
    String(agora.getMonth() + 1).padStart(2, "0");
}

function normalizar(valor) {
  return String(valor || "").trim().toLocaleLowerCase("pt-BR");
}

function definirMensagem(texto) {
  $("mensagem").textContent = texto;
}

function carregarDescricoes() {
  return fetch("produtos_ean.json?v=1", { cache: "no-cache" })
    .then(resposta => {
      if (!resposta.ok) {
        throw new Error("Não foi possível carregar produtos_ean.json.");
      }
      return resposta.json();
    })
    .then(dados => {
      if (!dados || typeof dados !== "object" || Array.isArray(dados)) {
        throw new Error("A base de produtos não é um JSON válido.");
      }

      descricoesEAN = dados;
    });
}

function obterDescricao(ean) {
  const codigo = String(ean || "").trim();
  const candidatos = [codigo];

  if (/^\d{12}$/.test(codigo)) candidatos.push("0" + codigo);
  if (/^0\d{12}$/.test(codigo)) candidatos.push(codigo.slice(1));

  for (const candidato of candidatos) {
    if (Object.prototype.hasOwnProperty.call(descricoesEAN, candidato)) {
      return String(descricoesEAN[candidato]);
    }
  }

  return "Descrição não encontrada";
}

function consultarHistorico() {
  if (consultaEmAndamento) return;

  const mes = $("mes").value;

  if (!/^\d{4}-\d{2}$/.test(mes)) {
    definirMensagem("Selecione um mês válido.");
    return;
  }

  consultaEmAndamento = true;
  $("btnBuscar").disabled = true;
  definirMensagem("Consultando os lançamentos...");

  const callbackAntigo = window.__historicoCb;
  const script = document.createElement("script");
  let finalizado = false;

  function finalizar() {
    if (finalizado) return;
    finalizado = true;
    consultaEmAndamento = false;
    $("btnBuscar").disabled = false;
    script.remove();

    if (callbackAntigo) {
      window.__historicoCb = callbackAntigo;
    } else {
      delete window.__historicoCb;
    }
  }

  const limite = setTimeout(() => {
    finalizar();
    definirMensagem(
      "A consulta demorou demais. Verifique a conexão e tente novamente."
    );
  }, 20000);

  window.__historicoCb = resposta => {
    clearTimeout(limite);
    finalizar();

    if (!resposta || !resposta.sucesso) {
      definirMensagem(
        resposta && resposta.mensagem
          ? resposta.mensagem
          : "Não foi possível consultar o histórico."
      );
      return;
    }

    todosRegistros = Array.isArray(resposta.registros)
      ? resposta.registros
      : [];

    renderizar();
  };

  script.onerror = () => {
    clearTimeout(limite);
    finalizar();
    definirMensagem(
      "Falha ao acessar o Apps Script. Confira se a implantação está atualizada e acessível."
    );
  };

  const parametros = new URLSearchParams({
    action: "historicoMes",
    callback: "__historicoCb",
    mes: mes
  });

  script.src = APPS_SCRIPT_URL + "?" + parametros.toString();
  document.head.appendChild(script);
}

function criarCelula(texto, classe) {
  const td = document.createElement("td");
  if (classe) td.className = classe;
  td.textContent = texto;
  return td;
}

function renderizar() {
  const funcionarioSelecionado = $("funcionario").value;

  const registros = todosRegistros.filter(registro =>
    !funcionarioSelecionado ||
    normalizar(registro.funcionario) === normalizar(funcionarioSelecionado)
  );

  $("totalRegistros").textContent = registros.length.toLocaleString("pt-BR");

  $("totalUnidades").textContent = registros.reduce(
    (total, registro) => total + (Number(registro.quantidade) || 0),
    0
  ).toLocaleString("pt-BR");

  $("totalFuncionarios").textContent = new Set(
    registros.map(registro => registro.funcionario)
  ).size.toLocaleString("pt-BR");

  const destino = $("resultado");
  destino.replaceChildren();

  if (!registros.length) {
    definirMensagem(
      "Nenhum lançamento encontrado para o mês e funcionário selecionados."
    );

    const vazio = document.createElement("div");
    vazio.className = "card vazio";
    vazio.textContent = "Não há lançamentos para exibir.";
    destino.appendChild(vazio);
    return;
  }

  definirMensagem(
    registros.length + " lançamento(s) encontrado(s) em " + $("mes").value + "."
  );

  const grupos = new Map();

  registros.forEach(registro => {
    const nome = registro.funcionario || "Funcionário não informado";
    if (!grupos.has(nome)) grupos.set(nome, []);
    grupos.get(nome).push(registro);
  });

  const nomes = Array.from(grupos.keys()).sort((a, b) =>
    a.localeCompare(b, "pt-BR")
  );

  nomes.forEach(nome => {
    const grupo = document.createElement("section");
    grupo.className = "card grupo";

    const titulo = document.createElement("h2");
    titulo.textContent = nome + " (" + grupos.get(nome).length + " lançamento(s))";
    grupo.appendChild(titulo);

    const wrap = document.createElement("div");
    wrap.className = "tabela-wrap";

    const tabela = document.createElement("table");
    const thead = document.createElement("thead");
    const trHead = document.createElement("tr");

    [
      "Produto / EAN",
      "Lote",
      "Validade",
      "Quantidade",
      "Data do lançamento"
    ].forEach(tituloColuna => {
      const th = document.createElement("th");
      th.textContent = tituloColuna;
      trHead.appendChild(th);
    });

    thead.appendChild(trHead);
    tabela.appendChild(thead);

    const tbody = document.createElement("tbody");

    grupos.get(nome)
      .slice()
      .sort((a, b) => String(b.dataLancamento).localeCompare(String(a.dataLancamento)))
      .forEach(registro => {
        const tr = document.createElement("tr");

        const tdProduto = document.createElement("td");
        const descricao = document.createElement("span");
        descricao.className = "descricao";
        descricao.textContent = obterDescricao(registro.codigo);

        const ean = document.createElement("span");
        ean.className = "ean";
        ean.textContent = "EAN: " + registro.codigo;

        tdProduto.append(descricao, ean);
        tr.appendChild(tdProduto);

        tr.appendChild(criarCelula(registro.lote));
        tr.appendChild(criarCelula(registro.validade));
        tr.appendChild(criarCelula(
          Number(registro.quantidade || 0).toLocaleString("pt-BR"),
          "quantidade"
        ));
        tr.appendChild(criarCelula(registro.dataLancamento));

        tbody.appendChild(tr);
      });

    tabela.appendChild(tbody);
    wrap.appendChild(tabela);
    grupo.appendChild(wrap);
    destino.appendChild(grupo);
  });
}

$("btnBuscar").addEventListener("click", consultarHistorico);
$("funcionario").addEventListener("change", renderizar);

$("mes").value = mesAtualISO();

const parametrosURL = new URLSearchParams(window.location.search);
const funcionarioURL = parametrosURL.get("funcionario");

if (funcionarioURL) {
  const opcao = Array.from($("funcionario").options).find(
    item => normalizar(item.value) === normalizar(funcionarioURL)
  );

  if (opcao) $("funcionario").value = opcao.value;
}

Promise.all([carregarDescricoes()])
  .then(consultarHistorico)
  .catch(erro => {
    console.error(erro);
    definirMensagem(
      "Não foi possível carregar produtos_ean.json. Confira se ele está na mesma pasta da página."
    );
  });
</script>
</body>
</html>
