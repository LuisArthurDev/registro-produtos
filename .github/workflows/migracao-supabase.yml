name: Supabase - preparar e importar

on:
  # Disparo seguro para confirmar que o Actions reconhece atualizações.
  # NÃO executa SQL nem importa dados automaticamente.
  push:
    paths:
      - '.github/workflows/migracao-supabase.yml'
      - 'scripts/baixar_dados_privados.py'
      - 'scripts/importar_dados.py'
      - 'tests/testar_download_storage.py'
  workflow_dispatch:
    inputs:
      etapa:
        description: 'Etapa (execute estrutura → validar → importar → finalizar)'
        required: true
        type: choice
        default: validar
        options:
          - estrutura
          - validar
          - importar
          - finalizar
      escopo:
        description: 'Parte a importar (somente na etapa importar)'
        required: true
        type: choice
        default: todos
        options:
          - todos
          - usuarios
          - produtos
          - mapas
          - vencidos
          - queima
          - auditoria
      confirmar_gravacao:
        description: 'Confirmo a importação para o banco (obrigatório para importar)'
        required: true
        type: boolean
        default: false
      pular_usuarios:
        description: 'Evitar reimportar contas e gerar PINs novos (escopo todos)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: supabase-migracao
  cancel-in-progress: false

jobs:
  verificar-ativacao:
    name: Verificar ativacao do workflow (sem banco)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Conferir arquivos e Python sem acesso ao Supabase
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/001_schema.sql
          test -f supabase/002_apos_importacao.sql
          test -f scripts/importar_dados.py
          test -f scripts/baixar_dados_privados.py
          python -m compileall -q scripts
          python -m unittest discover -s tests -p 'testar_download_storage.py' -v
          echo 'Workflow ativado e arquivos basicos conferidos. Nenhuma alteracao no banco.'
  executar:
    # O job com credenciais privadas só pode iniciar por execução manual.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MIGRATION_PIN_SEED: ${{ secrets.MIGRATION_PIN_SEED }}
      PINS_PASSPHRASE: ${{ secrets.PINS_PASSPHRASE }}
      MIGRATION_BUNDLE_URL: ${{ secrets.MIGRATION_BUNDLE_URL }}
      MIGRATION_STORAGE_BUCKET: migracao
      MIGRATION_STORAGE_OBJECT: dados-migracao.zip
      PGSSLMODE: require
      PGCONNECT_TIMEOUT: "15"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Conferir autorização e configurações
        env:
          ETAPA: ${{ inputs.etapa }}
          ESCOPO: ${{ inputs.escopo }}
          CONFIRMAR: ${{ inputs.confirmar_gravacao }}
          PULAR: ${{ inputs.pular_usuarios }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$ETAPA" == 'importar' && "$CONFIRMAR" != 'true' ]]; then
            echo 'Importação bloqueada: marque confirmar_gravacao.'; exit 1
          fi
          if [[ "$ETAPA" == 'estrutura' || "$ETAPA" == 'finalizar' ]]; then
            if [[ -z "$SUPABASE_DB_URL" ]]; then
              echo 'Defina SUPABASE_DB_URL em Settings > Secrets and variables > Actions.'; exit 1
            fi
          else
            if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_SECRET_KEY" ]]; then
              echo 'Defina SUPABASE_URL e SUPABASE_SECRET_KEY em Actions Secrets.'; exit 1
            fi
          fi
          if [[ "$ETAPA" == 'importar' && "$PULAR" != 'true' && ( "$ESCOPO" == 'todos' || "$ESCOPO" == 'usuarios' ) ]]; then
            if [[ ${#MIGRATION_PIN_SEED} -lt 32 || ${#PINS_PASSPHRASE} -lt 16 ]]; then
              echo 'Defina MIGRATION_PIN_SEED (32+ caracteres) e PINS_PASSPHRASE (16+ caracteres) em Actions Secrets.'
              exit 1
            fi
          fi
      - name: Verificar URL IPv4 do Supabase antes do SQL
        if: inputs.etapa == 'estrutura' || inputs.etapa == 'finalizar'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import os
          import sys
          from urllib.parse import urlsplit

          raw = os.environ.get('SUPABASE_DB_URL', '')
          try:
              uri = urlsplit(raw)
              host, port, user, password = uri.hostname or '', uri.port, uri.username or '', uri.password
          except ValueError:
              print('ERRO: SUPABASE_DB_URL inválida. Copie a URL de Connect → Session pooler.')
              sys.exit(1)

          if not host.endswith('.pooler.supabase.com') or port != 5432:
              print('ERRO: SUPABASE_DB_URL aponta para uma conexão incorreta.')
              print('GitHub Actions precisa do Shared Session pooler IPv4, porta 5432.')
              print('No Supabase: Connect → Session pooler → copiar URI e atualizar o secret no GitHub.')
              sys.exit(1)
          if not user.startswith('postgres.') or not password:
              print('ERRO: a conexão do pooler deve usar o usuário postgres.<project-ref> e senha do banco.')
              sys.exit(1)
          print('URL do Session pooler validada (IPv4, 5432).')
          PYCODE
      - name: Preparar cliente PostgreSQL
        if: inputs.etapa == 'estrutura' || inputs.etapa == 'finalizar'
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          fi
      - name: Testar conexão PostgreSQL sem alterar dados
        if: inputs.etapa == 'estrutura' || inputs.etapa == 'finalizar'
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -qAt -c 'SELECT 1' | grep -qx '1'
          echo 'Conexão PostgreSQL confirmada.'
      - name: Criar tabelas, políticas e funções SQL
        if: inputs.etapa == 'estrutura'
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/001_schema.sql
      - name: Baixar pacote de dados do Supabase Storage privado
        if: inputs.etapa == 'validar' || inputs.etapa == 'importar'
        run: python scripts/baixar_dados_privados.py
      - name: Validar dados (não grava nada)
        if: inputs.etapa == 'validar'
        run: python scripts/importar_dados.py
      - name: Importar dados para o Supabase
        if: inputs.etapa == 'importar'
        shell: bash
        env:
          ESCOPO: ${{ inputs.escopo }}
          PULAR: ${{ inputs.pular_usuarios }}
        run: |
          set -euo pipefail
          args=(--apply --only "$ESCOPO")
          if [[ "$PULAR" == 'true' && "$ESCOPO" == 'todos' ]]; then args+=(--sem-usuarios); fi
          python scripts/importar_dados.py "${args[@]}"
      - name: Criptografar PINs de primeiro acesso (nunca publicar texto puro)
        if: always() && inputs.etapa == 'importar'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f private_data/novos_pins_gerados.csv ]]; then
            printf '%s' "$PINS_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 --symmetric --cipher-algo AES256 \
              --output pins-iniciais.csv.gpg private_data/novos_pins_gerados.csv
            rm -f private_data/novos_pins_gerados.csv
            echo 'PINs protegidos; somente a versão criptografada será disponibilizada.'
          fi
      - name: Disponibilizar PINs criptografados por 3 dias
        if: always() && inputs.etapa == 'importar'
        uses: actions/upload-artifact@v4
        with:
          name: pins-iniciais-criptografados
          path: pins-iniciais.csv.gpg
          if-no-files-found: ignore
          retention-days: 3
      - name: Consolidar vínculos e validar contagens
        if: inputs.etapa == 'finalizar'
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/002_apos_importacao.sql
