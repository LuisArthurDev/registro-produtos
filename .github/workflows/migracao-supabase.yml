name: Supabase - preparar e importar

on:
  # Disparo seguro para confirmar que o Actions reconhece atualizações.
  # NÃO executa SQL nem importa dados automaticamente.
  push:
    paths:
      - '.github/workflows/migracao-supabase.yml'
      - 'scripts/baixar_dados_privados.py'
      - 'scripts/importar_dados.py'
      - 'tests/testar_download_storage.py'
      - 'tests/testar_storage_400.py'
      - 'tests/testar_importacao.py'
      - 'tests/testar_usuario_fk.py'
  workflow_dispatch:
    inputs:
      etapa:
        description: 'Etapa (execute estrutura → validar → importar → finalizar)'
        required: true
        type: choice
        default: validar
        options:
          - estrutura
          - validar
          - importar
          - finalizar
          - ajustar_pendencias
          - atualizar_painel
          - configurar_notificacoes
          - notificacoes_para_todos
          - pin_administrador_geral
          - atualizar_operacoes
          - atualizar_perdas_transferencias
          - atualizar_visualizacao
          - habilitar_duplo_perfil
          - proteger_geral_e_funcionarios
          - organizar_secoes
          - mes_opcional_transferencias
          - visibilidade_secoes
          - pendencias_ean_lancamentos
          - grupos_produtos
          - salvar_organizacao_grupos
          - descer_estoque_lote
          - formulas_especiais_queima_gondola
      escopo:
        description: 'Parte a importar (usuarios primeiro; operacionais depois, sem reenviar produtos)'
        required: true
        type: choice
        default: todos
        options:
          - todos
          - usuarios
          - produtos
          - operacionais
          - mapas
          - vencidos
          - queima
          - auditoria
      confirmar_gravacao:
        description: 'Confirmo a importação para o banco (obrigatório para importar)'
        required: true
        type: boolean
        default: false
      pular_usuarios:
        description: 'Evitar reimportar contas e gerar PINs novos (escopo todos)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: supabase-migracao
  cancel-in-progress: false

jobs:
  verificar-ativacao:
    name: Verificar ativacao do workflow (sem banco)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Conferir arquivos e Python sem acesso ao Supabase
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/001_schema.sql
          test -f supabase/002_apos_importacao.sql
          test -f scripts/importar_dados.py
          test -f scripts/baixar_dados_privados.py
          python -m compileall -q scripts
          python -m unittest discover -s tests -p 'testar*.py' -v
          echo 'Workflow ativado e arquivos basicos conferidos. Nenhuma alteracao no banco.'
  executar:
    # O job com credenciais privadas só pode iniciar por execução manual.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MIGRATION_PIN_SEED: ${{ secrets.MIGRATION_PIN_SEED }}
      PINS_PASSPHRASE: ${{ secrets.PINS_PASSPHRASE }}
      MIGRATION_BUNDLE_URL: ${{ secrets.MIGRATION_BUNDLE_URL }}
      MIGRATION_STORAGE_BUCKET: migracao
      MIGRATION_STORAGE_OBJECT: dados-migracao.zip
      PGSSLMODE: require
      PGCONNECT_TIMEOUT: "15"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Conferir autorização e configurações
        env:
          ETAPA: ${{ inputs.etapa }}
          ESCOPO: ${{ inputs.escopo }}
          CONFIRMAR: ${{ inputs.confirmar_gravacao }}
          PULAR: ${{ inputs.pular_usuarios }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$ETAPA" == 'importar' && "$CONFIRMAR" != 'true' ]]; then
            echo 'Importação bloqueada: marque confirmar_gravacao.'; exit 1
          fi
          if [[ "$ETAPA" == 'estrutura' || "$ETAPA" == 'finalizar' || "$ETAPA" == 'ajustar_pendencias' || "$ETAPA" == 'atualizar_painel' || "$ETAPA" == 'configurar_notificacoes' || "$ETAPA" == 'notificacoes_para_todos' || "$ETAPA" == 'pin_administrador_geral' || "$ETAPA" == 'atualizar_operacoes' || "$ETAPA" == 'atualizar_perdas_transferencias' || "$ETAPA" == 'atualizar_visualizacao' || "$ETAPA" == 'habilitar_duplo_perfil' || "$ETAPA" == 'proteger_geral_e_funcionarios' || "$ETAPA" == 'organizar_secoes' || "$ETAPA" == 'mes_opcional_transferencias' || "$ETAPA" == 'visibilidade_secoes' || "$ETAPA" == 'pendencias_ean_lancamentos' || "$ETAPA" == 'grupos_produtos' || "$ETAPA" == 'salvar_organizacao_grupos' || "$ETAPA" == 'descer_estoque_lote' ]]; then
            if [[ -z "$SUPABASE_DB_URL" ]]; then
              echo 'Defina SUPABASE_DB_URL em Settings > Secrets and variables > Actions.'; exit 1
            fi
          else
            if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_SECRET_KEY" ]]; then
              echo 'Defina SUPABASE_URL e SUPABASE_SECRET_KEY em Actions Secrets.'; exit 1
            fi
          fi
          if [[ "$ETAPA" == 'importar' && "$PULAR" != 'true' && ( "$ESCOPO" == 'todos' || "$ESCOPO" == 'usuarios' ) ]]; then
            if [[ ${#MIGRATION_PIN_SEED} -lt 32 || ${#PINS_PASSPHRASE} -lt 16 ]]; then
              echo 'Defina MIGRATION_PIN_SEED (32+ caracteres) e PINS_PASSPHRASE (16+ caracteres) em Actions Secrets.'
              exit 1
            fi
          fi
      - name: Verificar URL IPv4 do Supabase antes do SQL
        if: inputs.etapa == 'estrutura' || inputs.etapa == 'finalizar' || inputs.etapa == 'ajustar_pendencias' || inputs.etapa == 'atualizar_painel' || inputs.etapa == 'configurar_notificacoes' || inputs.etapa == 'notificacoes_para_todos' || inputs.etapa == 'pin_administrador_geral' || inputs.etapa == 'atualizar_operacoes' || inputs.etapa == 'atualizar_perdas_transferencias' || inputs.etapa == 'atualizar_visualizacao' || inputs.etapa == 'habilitar_duplo_perfil' || inputs.etapa == 'proteger_geral_e_funcionarios' || inputs.etapa == 'organizar_secoes' || inputs.etapa == 'mes_opcional_transferencias' || inputs.etapa == 'visibilidade_secoes' || inputs.etapa == 'pendencias_ean_lancamentos' || inputs.etapa == 'grupos_produtos' || inputs.etapa == 'salvar_organizacao_grupos' || inputs.etapa == 'descer_estoque_lote'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import os
          import sys
          from urllib.parse import urlsplit

          raw = os.environ.get('SUPABASE_DB_URL', '')
          try:
              uri = urlsplit(raw)
              host, port, user, password = uri.hostname or '', uri.port, uri.username or '', uri.password
          except ValueError:
              print('ERRO: SUPABASE_DB_URL inválida. Copie a URL de Connect → Session pooler.')
              sys.exit(1)

          if not host.endswith('.pooler.supabase.com') or port != 5432:
              print('ERRO: SUPABASE_DB_URL aponta para uma conexão incorreta.')
              print('GitHub Actions precisa do Shared Session pooler IPv4, porta 5432.')
              print('No Supabase: Connect → Session pooler → copiar URI e atualizar o secret no GitHub.')
              sys.exit(1)
          if not user.startswith('postgres.') or not password:
              print('ERRO: a conexão do pooler deve usar o usuário postgres.<project-ref> e senha do banco.')
              sys.exit(1)
          print('URL do Session pooler validada (IPv4, 5432).')
          PYCODE
      - name: Preparar cliente PostgreSQL
        if: inputs.etapa == 'estrutura' || inputs.etapa == 'finalizar' || inputs.etapa == 'ajustar_pendencias' || inputs.etapa == 'atualizar_painel' || inputs.etapa == 'configurar_notificacoes' || inputs.etapa == 'notificacoes_para_todos' || inputs.etapa == 'pin_administrador_geral' || inputs.etapa == 'atualizar_operacoes' || inputs.etapa == 'atualizar_perdas_transferencias' || inputs.etapa == 'atualizar_visualizacao' || inputs.etapa == 'habilitar_duplo_perfil' || inputs.etapa == 'proteger_geral_e_funcionarios' || inputs.etapa == 'organizar_secoes' || inputs.etapa == 'mes_opcional_transferencias' || inputs.etapa == 'visibilidade_secoes' || inputs.etapa == 'pendencias_ean_lancamentos' || inputs.etapa == 'grupos_produtos' || inputs.etapa == 'salvar_organizacao_grupos' || inputs.etapa == 'descer_estoque_lote'
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          fi
      - name: Testar conexão PostgreSQL sem alterar dados
        if: inputs.etapa == 'estrutura' || inputs.etapa == 'finalizar' || inputs.etapa == 'ajustar_pendencias' || inputs.etapa == 'atualizar_painel' || inputs.etapa == 'configurar_notificacoes' || inputs.etapa == 'notificacoes_para_todos' || inputs.etapa == 'pin_administrador_geral' || inputs.etapa == 'atualizar_operacoes' || inputs.etapa == 'atualizar_perdas_transferencias' || inputs.etapa == 'atualizar_visualizacao' || inputs.etapa == 'habilitar_duplo_perfil' || inputs.etapa == 'proteger_geral_e_funcionarios' || inputs.etapa == 'organizar_secoes' || inputs.etapa == 'mes_opcional_transferencias' || inputs.etapa == 'visibilidade_secoes' || inputs.etapa == 'pendencias_ean_lancamentos' || inputs.etapa == 'grupos_produtos' || inputs.etapa == 'salvar_organizacao_grupos' || inputs.etapa == 'descer_estoque_lote'
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -qAt -c 'SELECT 1' | grep -qx '1'
          echo 'Conexão PostgreSQL confirmada.'
      - name: Descer itens selecionados do Estoque em lote (SQL 019)
        if: inputs.etapa == 'descer_estoque_lote'
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/019_descer_estoque_em_lote.sql
          echo 'Descida em lote habilitada para a loja.'
      - name: Salvar organizacao por grupo em lote atomico (SQL 018)
        if: inputs.etapa == 'salvar_organizacao_grupos'
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/018_salvar_organizacao_grupos.sql
          echo 'Funcao transacional de salvamento por lote habilitada.'
      - name: Criar tabelas, políticas e funções SQL
        if: inputs.etapa == 'estrutura'
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/001_schema.sql
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/003_pendencias.sql
      - name: Preparar correção de pendências (sem mexer nos lançamentos existentes)
        if: inputs.etapa == 'ajustar_pendencias'
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/003_pendencias.sql
      - name: Atualizar funções do Painel Conferente (aditivo)
        if: inputs.etapa == 'atualizar_painel'
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/003_pendencias.sql
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/004_painel_conferente.sql
      - name: Habilitar edição e exclusão auditável (Perdas, Transferências e Tentativa)
        if: inputs.etapa == 'atualizar_perdas_transferencias'
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/009_operacoes_perdas_transferencias.sql
          echo 'Ações auditáveis habilitadas.'
      - name: Habilitar ocultação e exclusão visual de seções (SQL 015)
        if: inputs.etapa == 'visibilidade_secoes'
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/015_visibilidade_secoes.sql
          echo 'Visibilidade de seções habilitada sem excluir produtos ou lançamentos.'
      - name: Permitir transferência de lançamentos sem filtrar mês (SQL 014)
        if: inputs.etapa == 'mes_opcional_transferencias'
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/014_mes_opcional_transferencias.sql
          echo 'Transferências com mês opcional habilitadas.'
      - name: Criar quadro de organização das seções (SQL 013)
        if: inputs.etapa == 'organizar_secoes'
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/013_organizacao_secoes.sql
          echo 'Quadro de seções habilitado sem mover qualquer lançamento.'
      - name: Restringir Painel Geral e habilitar transferência de lançamentos (SQL 012)
        if: inputs.etapa == 'proteger_geral_e_funcionarios'
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/012_exclusividade_geral_funcionarios.sql
          echo 'Titular exclusivo e gestão de lançamentos atualizados.'
      - name: Fórmulas Especiais e dados da Gôndola na Queima (SQL 020)
        if: inputs.etapa == 'formulas_especiais_queima_gondola'
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/020_formulas_especiais_queima_gondola.sql
          echo 'Fórmulas Especiais, proteção da Queima e dados de gôndola ativados.'
      - name: Ativar Grupos no catálogo e reiniciar organização (SQL 017)
        if: inputs.etapa == 'grupos_produtos'
        shell: bash
        run: |
          set -euo pipefail
          # Corrige também a migração de pendências quando ainda não tiver sido aplicada.
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/016_pendencias_ean_lancamentos.sql
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/017_grupos_produtos.sql
          echo 'Coluna Grupo e organização de Grupos ativadas. SQL 016 verificada.'
      - name: Pendências de EAN não encontrado nos lançamentos (SQL 016)
        if: inputs.etapa == 'pendencias_ean_lancamentos'
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/016_pendencias_ean_lancamentos.sql
          echo 'Pendências de EAN ativadas; lançamentos preservados.'
      - name: Habilitar acesso duplo Luis Arthur Loja 151 (SQL 011)
        if: inputs.etapa == 'habilitar_duplo_perfil'
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/011_luis_arthur_duplo_perfil.sql
          echo 'Conta atualizada com acesso duplo. O usuário deverá entrar novamente.'
      - name: Habilitar visualização, sinalização e retirada do próprio mapa (SQL 010)
        if: inputs.etapa == 'atualizar_visualizacao'
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/010_visualizacao_funcionarios.sql
          echo 'Visualização e retirada por funcionário habilitadas.'
      - name: Atualizar operações de Queima e Transferências (aditivo)
        if: inputs.etapa == 'atualizar_operacoes'
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/008_operacoes_lancamento.sql
          echo 'Transferências idempotentes e relançamento mensal atualizados.'
      - name: Criar tabelas de aparelhos e notificações OneSignal (aditivo)
        if: inputs.etapa == 'configurar_notificacoes'
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/005_notificacoes_onesignal.sql
          echo 'Tabelas push_dispositivos/notificacao_envios criadas; nenhuma mensagem enviada.'
      - name: Baixar pacote de dados do Supabase Storage privado
        if: inputs.etapa == 'validar' || inputs.etapa == 'importar'
        run: python scripts/baixar_dados_privados.py
      - name: Validar dados (não grava nada)
        if: inputs.etapa == 'validar'
        run: python scripts/importar_dados.py
      - name: Importar dados para o Supabase
        if: inputs.etapa == 'importar'
        shell: bash
        env:
          ESCOPO: ${{ inputs.escopo }}
          PULAR: ${{ inputs.pular_usuarios }}
        run: |
          set -euo pipefail
          args=(--apply --only "$ESCOPO")
          if [[ "$PULAR" == 'true' && "$ESCOPO" == 'todos' ]]; then args+=(--sem-usuarios); fi
          python scripts/importar_dados.py "${args[@]}"
      - name: Criptografar PINs de primeiro acesso (nunca publicar texto puro)
        if: always() && inputs.etapa == 'importar'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f private_data/novos_pins_gerados.csv ]]; then
            printf '%s' "$PINS_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 --symmetric --cipher-algo AES256 \
              --output pins-iniciais.csv.gpg private_data/novos_pins_gerados.csv
            rm -f private_data/novos_pins_gerados.csv
            echo 'PINs protegidos; somente a versão criptografada será disponibilizada.'
          fi
      - name: Disponibilizar PINs criptografados por 3 dias
        if: always() && inputs.etapa == 'importar'
        uses: actions/upload-artifact@v4
        with:
          name: pins-iniciais-criptografados
          path: pins-iniciais.csv.gpg
          if-no-files-found: ignore
          retention-days: 3
      - name: Consolidar vínculos e validar contagens
        if: inputs.etapa == 'finalizar'
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/002_apos_importacao.sql

      - name: Permitir inscrição de notificações para todos (SQL aditivo)
        if: inputs.etapa == 'notificacoes_para_todos'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/006_notificacoes_para_todos.sql
          echo 'Consentimento de notificações habilitado para todos os perfis.'

      - name: Habilitar troca de PIN do Administrador Geral (SQL aditivo)
        if: inputs.etapa == 'pin_administrador_geral'
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/007_pin_administrador_geral.sql
          echo 'Troca de PIN próprio do Administrador Geral habilitada.'
