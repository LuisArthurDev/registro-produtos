name: Atualiza produtos_ean

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Executa conversão
        run: python scripts/atualiza_produtos_ean.py

      - name: Commit e push das mudanças
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add produtos_ean.json
          if git diff --cached --quiet; then
            echo "Nenhuma mudança para enviar."
            exit 0
          fi
          git commit -m "Atualiza produtos_ean.json"
          git push
