name: Importar catálogo para Cloudflare D1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: importar-catalogo-cloudflare-d1
  cancel-in-progress: false

jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js no runner do GitHub
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verificar configuração e segredo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Falta cadastrar o secret CLOUDFLARE_API_TOKEN em Settings > Secrets and variables > Actions."
            exit 1
          fi
          test -f worker/wrangler.toml
          test -f worker/migrations/0001_schema.sql
          for i in $(seq -f "%02g" 1 9); do
            test -f "worker/migrations/0002_import_${i}.sql"
          done

      - name: Criar tabela e índice (seguro para reexecução)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute registro-produtos --remote --config worker/wrangler.toml --file worker/migrations/0001_schema.sql

      - name: Importar os nove lotes (ignora EANs já importados)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          for i in $(seq -f "%02g" 1 9); do
            source_file="worker/migrations/0002_import_${i}.sql"
            temp_file="${RUNNER_TEMP}/import_${i}.sql"
            echo "Importando ${source_file}..."
            sed 's/^INSERT INTO produtos/INSERT OR IGNORE INTO produtos/' "$source_file" > "$temp_file"
            npx --yes wrangler@4 d1 execute registro-produtos --remote --config worker/wrangler.toml --file "$temp_file"
          done

      - name: Conferir os 82.972 produtos pela API
        run: |
          set -euo pipefail
          response="$(curl --retry 5 --retry-delay 5 --retry-all-errors -fsS https://registro-produtos-api.luisarthurofficial.workers.dev/api/health)"
          echo "$response"
          echo "$response" | jq -e '.sucesso == true and .total == 82972' >/dev/null
          echo "Catálogo validado: 82.972 produtos no D1."
