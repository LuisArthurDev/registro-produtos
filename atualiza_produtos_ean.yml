
name: Atualizar produtos EAN

on:
  workflow_dispatch:

  push:
    paths:
      - "Items.ods"
      - "produtos_ean.json"
      - "scripts/atualizar_produtos.py"
      - ".github/workflows/atualizar-produtos.yml"

permissions:
  contents: write

concurrency:
  group: atualizar-produtos-ean
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas odfpy

      - name: Verificar arquivos necessários
        run: |
          echo "Raiz do repositório: $GITHUB_WORKSPACE"

          test -f "$GITHUB_WORKSPACE/Items.ods" || {
            echo "ERRO: Items.ods não encontrado na raiz."
            echo "Arquivos encontrados:"
            find . -maxdepth 3 -type f | sort
            exit 1
          }

          test -f "$GITHUB_WORKSPACE/produtos_ean.json" || {
            echo "ERRO: produtos_ean.json não encontrado na raiz."
            exit 1
          }

          test -f "$GITHUB_WORKSPACE/scripts/atualizar_produtos.py" || {
            echo "ERRO: scripts/atualizar_produtos.py não encontrado."
            exit 1
          }

      - name: Atualizar JSON
        run: python scripts/atualizar_produtos.py

      - name: Salvar alterações no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add produtos_ean.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteração no JSON."
          else
            git commit -m "Atualiza dados dos produtos"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
