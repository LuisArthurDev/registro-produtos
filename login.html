<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f2a3d">
  <title>Login | Registro de Mapa de Validade</title>

  <style>
    :root {
      color-scheme: light;
      --bg: #edf2f7;
      --surface: #ffffff;
      --ink: #172b3a;
      --muted: #667887;
      --primary: #0f2a3d;
      --primary-hover: #193e56;
      --border: #dce5ec;
      --input: #f8fafc;
      --error-bg: #fff0f0;
      --error: #b42318;
      --success-bg: #ecfdf3;
      --success: #027a48;
      --shadow: 0 20px 60px rgba(15, 42, 61, 0.12);
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #0c1722;
      --surface: #142331;
      --ink: #edf4fa;
      --muted: #a4b5c5;
      --primary: #8ac6ef;
      --primary-hover: #b5ddf6;
      --border: #304454;
      --input: #101e2b;
      --error-bg: #3b1c21;
      --error: #ffb4ab;
      --success-bg: #12372b;
      --success: #75e0ad;
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(
          circle at 15% 15%,
          rgba(37, 99, 138, 0.12),
          transparent 34%
        ),
        var(--bg);
      color: var(--ink);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      transition: background 0.2s, color 0.2s;
    }

    button,
    input {
      font: inherit;
    }

    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 44px;
      height: 44px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      font-size: 19px;
    }

    .login-container {
      width: 100%;
      max-width: 430px;
    }

    .brand {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand-icon {
      width: 66px;
      height: 66px;
      margin: 0 auto 16px;
      display: grid;
      place-items: center;
      border-radius: 20px;
      background: var(--primary);
      color: #fff;
      font-size: 29px;
      box-shadow: var(--shadow);
    }

    [data-theme="dark"] .brand-icon {
      color: #102232;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(23px, 5vw, 29px);
      letter-spacing: -0.7px;
    }

    .brand p {
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .card {
      padding: 30px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .card h2 {
      margin: 0 0 7px;
      font-size: 21px;
    }

    .card-description {
      margin: 0 0 25px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .field {
      margin-bottom: 19px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 650;
    }

    .input-wrap {
      position: relative;
    }

    input {
      display: block;
      width: 100%;
      min-height: 49px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
      background: var(--input);
      color: var(--ink);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: #3986b4;
      box-shadow: 0 0 0 3px rgba(57, 134, 180, 0.15);
    }

    input::placeholder {
      color: var(--muted);
      opacity: 0.8;
    }

    .password-input {
      padding-right: 52px;
    }

    .show-password {
      position: absolute;
      top: 50%;
      right: 8px;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 17px;
    }

    .show-password:hover {
      background: var(--border);
    }

    .message {
      display: none;
      margin: 0 0 17px;
      padding: 12px 13px;
      border-radius: 11px;
      font-size: 13px;
      line-height: 1.5;
    }

    .message.error {
      display: block;
      background: var(--error-bg);
      color: var(--error);
    }

    .message.success {
      display: block;
      background: var(--success-bg);
      color: var(--success);
    }

    .submit-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 50px;
      margin-top: 8px;
      border: 0;
      border-radius: 12px;
      background: var(--primary);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.2s;
    }

    [data-theme="dark"] .submit-button {
      color: #102232;
    }

    .submit-button:hover:not(:disabled) {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .submit-button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .spinner {
      display: none;
      width: 17px;
      height: 17px;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    .submit-button.loading .spinner {
      display: inline-block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .footer {
      margin-top: 22px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .security-note {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      margin-top: 18px;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 480px) {
      body {
        padding: 20px 15px;
      }

      .card {
        padding: 24px 20px;
      }

      .theme-toggle {
        top: 12px;
        right: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <button
    class="theme-toggle"
    id="themeToggle"
    type="button"
    aria-label="Alternar tema"
    title="Alternar tema"
  >🌙</button>

  <main class="login-container">
    <header class="brand">
      <div class="brand-icon" aria-hidden="true">▤</div>
      <h1>Mapa de Validade</h1>
      <p>Registro e gerenciamento de produtos</p>
    </header>

    <section class="card" aria-labelledby="loginTitle">
      <h2 id="loginTitle">Bem-vindo de volta</h2>
      <p class="card-description">
        Entre com seu usuário e sua senha para continuar.
      </p>

      <div
        class="message"
        id="message"
        role="alert"
        aria-live="polite"
      ></div>

      <form id="loginForm" autocomplete="on">
        <div class="field">
          <label for="usuario">Usuário</label>
          <input
            id="usuario"
            name="username"
            type="text"
            placeholder="Digite seu usuário"
            autocomplete="username"
            maxlength="80"
            required
          >
        </div>

        <div class="field">
          <label for="senha">Senha</label>
          <div class="input-wrap">
            <input
              class="password-input"
              id="senha"
              name="password"
              type="password"
              placeholder="Digite sua senha"
              autocomplete="current-password"
              maxlength="200"
              required
            >
            <button
              class="show-password"
              id="showPassword"
              type="button"
              aria-label="Mostrar senha"
              title="Mostrar senha"
            >◉</button>
          </div>
        </div>

        <button class="submit-button" id="submitButton" type="submit">
          <span class="spinner" aria-hidden="true"></span>
          <span id="buttonText">Entrar</span>
          <span aria-hidden="true">→</span>
        </button>
      </form>

      <div class="security-note">
        <span aria-hidden="true">🔒</span>
        <span>Acesso destinado a usuários autorizados</span>
      </div>
    </section>

    <footer class="footer">
      Registro de Mapa de Validade<br>
      Sistema interno de gerenciamento
    </footer>
  </main>

  <script>
    /*
     * INTEGRAÇÃO PENDENTE
     *
     * Este HTML ainda não autentica usuários sozinho.
     * O Login.gs precisa disponibilizar uma operação de autenticação
     * que receba usuário e senha, valide as credenciais no servidor
     * e retorne uma sessão válida.
     *
     * Não coloque senhas ou listas de usuários neste arquivo.
     */

    const form = document.getElementById("loginForm");
    const usuarioInput = document.getElementById("usuario");
    const senhaInput = document.getElementById("senha");
    const submitButton = document.getElementById("submitButton");
    const buttonText = document.getElementById("buttonText");
    const message = document.getElementById("message");

    function mostrarMensagem(texto, tipo) {
      message.textContent = texto;
      message.className = "message " + tipo;
    }

    function limparMensagem() {
      message.textContent = "";
      message.className = "message";
    }

    function definirCarregamento(ativo) {
      submitButton.disabled = ativo;
      submitButton.classList.toggle("loading", ativo);
      buttonText.textContent = ativo ? "Verificando..." : "Entrar";
    }

    document.getElementById("showPassword").addEventListener("click", () => {
      const mostrar = senhaInput.type === "password";
      senhaInput.type = mostrar ? "text" : "password";

      const botao = document.getElementById("showPassword");
      botao.setAttribute(
        "aria-label",
        mostrar ? "Ocultar senha" : "Mostrar senha"
      );
      botao.title = mostrar ? "Ocultar senha" : "Mostrar senha";
    });

    document.getElementById("themeToggle").addEventListener("click", () => {
      const raiz = document.documentElement;
      const escuro = raiz.getAttribute("data-theme") !== "dark";

      raiz.setAttribute("data-theme", escuro ? "dark" : "light");
      document.getElementById("themeToggle").textContent =
        escuro ? "☀️" : "🌙";
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      limparMensagem();

      const usuario = usuarioInput.value.trim();
      const senha = senhaInput.value;

      if (!usuario || !senha) {
        mostrarMensagem(
          "Informe seu usuário e sua senha.",
          "error"
        );
        return;
      }

      /*
       * Não redirecionar nem considerar o usuário autenticado
       * até a integração com o servidor estar implementada.
       */
      mostrarMensagem(
        "A tela está pronta, mas falta conectar a autenticação ao Login.gs. Nenhum acesso foi liberado.",
        "error"
      );
    });
  </script>
</body>
</html>
